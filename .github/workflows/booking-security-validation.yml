name: Booking security and performance validation

on:
  push:
    branches: [security/booking-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Bangkok
    steps:
      - name: ดึงโค้ดแขนงนี้
        uses: actions/checkout@v4

      - name: เตรียม Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: เตรียม Java สำหรับระบบจำลอง
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: เตรียม k6
        uses: grafana/setup-k6-action@v1

      - name: ติดตั้งชุดโปรแกรมหลังบ้าน
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund

      - name: ติดตั้งเครื่องมือ Firebase สำหรับระบบจำลอง
        run: npm install --global firebase-tools@15.18.0 --no-audit --no-fund

      - name: รันชุดตรวจเดิมทั้งหมด
        run: node --test tests/*.test.js

      - name: รัน Greenfield Phase 2 กับ RTDB Emulator แบบ demo
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: firebase emulators:exec --only database --project demo-sl-transit-greenfield --config greenfield-erp/phase2/firebase.demo.json "node tests/greenfield-erp-phase2-emulator.test.js"
      - name: รันการตรวจพฤติกรรมและวัดความเร็วในระบบจำลอง
        env:
          GCLOUD_PROJECT: sl-transit-9464e
        run: firebase emulators:exec --only auth,database,functions,storage --project sl-transit-9464e "node tools/run-emulator-validation.js"
