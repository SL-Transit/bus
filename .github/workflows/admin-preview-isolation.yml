name: Admin Preview Isolation

on:
  pull_request:
    paths:
      - 'admin-erp-preview.html'
      - 'tests/admin-preview-isolation.test.js'
      - '.github/workflows/admin-preview-isolation.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify protected files are unchanged
        shell: bash
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          if grep -E '^(admin-erp\.html|booking1\.html|booking\.html|booking-pos\.js|booking-bridge\.js|booking1-preview-adapter\.js|passenger\.html|check_ticket\.html|cancel_ticket\.html|functions/|database\.rules\.json)' changed.txt; then
            echo 'Protected production files changed.' >&2
            exit 1
          fi
      - name: Run preview isolation test
        run: node tests/admin-preview-isolation.test.js
