name: Admin Security Checks

on:
  pull_request:
    paths:
      - "admin-erp.html"
      - "admin-dashboard-read-model.js"
      - "firebase-web-config.js"
      - "database.rules.json"
      - "functions/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/admin-security-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
