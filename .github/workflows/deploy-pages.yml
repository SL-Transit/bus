name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          # Only staff and driver entry points are published. Passenger HTML
          # remains in the repository for reference and is absent from Pages.
          cp admin.html admin-bootstrap.html admin-console.html admin-erp.html \
            admin-erp1.html admin-quick-edit.html driver-map.html _site/
          cp -R *.js manifest.webmanifest .nojekyll assets _site/
          mkdir -p _site/greenfield-erp/phase2
          cp greenfield-erp/phase2/excel-row-mapper.js _site/greenfield-erp/phase2/
          cover=driver-android/src/main/res/drawable-nodpi/app_cover.png
          mkdir -p "_site/$(dirname "$cover")"
          cp "$cover" "_site/$cover"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
