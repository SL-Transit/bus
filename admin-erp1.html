<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL-Transit Admin ERP</title><style>:root{--bg:#f4f7fb;--panel:#fff;--ink:#18324d;--muted:#71849a;--line:#dbe5ef;--nav:#082b4d;--blue:#1677c8;--teal:#09a4ad;--soft:#eef6fc;--warn:#a35e00}html[data-theme=dark]{--bg:#0d1b2a;--panel:#14283a;--ink:#e9f2fa;--muted:#91a9bc;--line:#2b455b;--nav:#071726;--soft:#19344a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Noto Sans Thai",Arial,sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);padding:20px 14px;color:#d9e8f5}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px;border-bottom:1px solid #fff2}.brand img{width:52px;height:40px;object-fit:contain;background:#fff;border-radius:7px}.brand strong{display:block;color:#fff}.brand small{font-size:10px;color:#9eb9ce}.nav{display:grid;gap:6px;margin-top:24px}.nav button{border:0;background:transparent;color:#c4d6e5;text-align:left;border-radius:8px;padding:11px 12px}.nav button.active{background:#15639a;color:#fff;border-left:3px solid var(--teal)}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top-left,.top-right,.actions,.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.menu{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px}.menu i,.menu i:before,.menu i:after{display:block;height:2px;background:var(--ink);content:"";position:relative}.menu i:before{position:absolute;top:-7px;width:100%}.menu i:after{position:absolute;top:7px;width:100%}.search,.field{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 12px}.search{width:330px}.icon,.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px 12px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:700}.content{max-width:1600px;margin:auto;padding:28px}.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}.head{display:flex;justify-content:space-between;gap:18px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:29px}.head p{margin:0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 22px #16446d0d}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}.kpi{padding:18px;min-height:115px}.label{color:var(--muted)}.value{font-size:28px;font-weight:750;margin-top:8px}.filters{margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px}.chip.active{background:var(--soft);color:var(--blue)}.schedule-wrap{overflow:auto}.ops-table{border-collapse:collapse;min-width:1250px;width:100%;font-size:12px}.ops-table th,.ops-table td{border:1px solid var(--line);padding:11px;white-space:nowrap;text-align:left}.ops-table th{background:var(--soft);color:var(--muted);position:sticky;top:0}.queue{color:var(--blue);font-weight:750}.service{color:var(--teal);font-weight:650}.gps{color:var(--muted)}.action{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--blue);padding:6px 9px}.foot{display:flex;justify-content:space-between;padding:11px 15px;color:var(--muted);font-size:12px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.detail{padding:18px}.detail h2{font-size:16px;margin-top:0}.empty{min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink)}.notice{padding:13px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}.drawer{position:fixed;top:0;right:0;bottom:0;width:410px;background:var(--panel);z-index:40;box-shadow:-12px 0 35px #061a2b33;transform:translateX(100%);transition:.2s;padding:22px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer h2{margin-top:30px}.drawer-close{float:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cell{border:1px solid var(--line);border-radius:8px;padding:10px}.cell small{display:block;color:var(--muted);margin-bottom:4px}.overlay{display:none}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:.2s;display:block}.side.open{transform:translateX(0)}.menu{display:block}.overlay.show{display:block;position:fixed;inset:0;background:#061a2b66;z-index:20}.top{height:60px;padding:0 14px}.search{width:190px}.content{padding:16px 12px}.head{display:block}.actions{margin-top:14px}.lower{grid-template-columns:1fr}.drawer{width:min(410px,92vw)}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><img src="assets/sl-transit-logo-admin.jpg" alt="SL-Transit"><div><strong>SL-TRANSIT</strong><small>ADMIN ERP CONSOLE</small></div></div><nav class="nav" id="nav"></nav></aside><div class="overlay" id="overlay"></div><main><header class="top"><div class="top-left"><button class="menu" id="menu" aria-label="เปิดเมนู"><i></i></button><input class="search" placeholder="ค้นหาในระบบ"></div><div class="top-right"><button class="icon" id="theme">Light</button><div class="avatar">A</div></div></header><section class="content" id="content"></section></main></div><aside class="drawer" id="drawer"><button class="btn drawer-close" id="close">ปิด</button><div id="drawerBody"></div></aside><script>var pages=[['dashboard','แดชบอร์ด'],['finance','รายได้ / จอง / ยกเลิก'],['ops','การเดินรถ / ตารางเที่ยวบริการ'],['data','จัดการข้อมูล'],['news','อัพเดทข่าวสาร'],['staff','พนักงาน / สิทธิ์'],['account','ตั้งค่าบัญชี'],['test','โหมดทดสอบ'],['logout','ออกจากระบบ']];var nav=document.getElementById('nav');pages.forEach(function(p){var b=document.createElement('button');b.textContent=p[1];b.dataset.page=p[0];nav.appendChild(b)});var empty='<div class="empty"><div><strong>ยังไม่มีข้อมูลให้แสดง</strong><span>หน้าจอนี้จะพร้อมเมื่อเชื่อมต่อแหล่งข้อมูลที่ยืนยันแล้ว</span></div></div>';function head(t,d,a){return '<div class="crumb">SL-Transit / Admin ERP</div><div class="head"><div><h1>'+t+'</h1><p>'+d+'</p></div>'+(a?'<button class="btn primary">'+a+'</button>':'')+'</div>'}function standard(t,d){return head(t,d)+'<section class="card">'+empty+'</section>'}function dashboard(){return head('แดชบอร์ด','ภาพรวมการดำเนินงานของ SL-Transit','รีเฟรชข้อมูล')+'<div class="kpis">'+['รายได้วันนี้','การจองวันนี้','ยกเลิกวันนี้','เที่ยวบริการวันนี้'].map(function(x){return '<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div></article>'}).join('')+'</div>'+empty}function finance(){return head('รายได้ / จอง / ยกเลิก','ตรวจสอบรายได้และสถานะการจอง','ส่งออกข้อมูล')+'<div class="kpis">'+['ยอดจองรวม','ชำระแล้ว','คืนเงิน','รอตรวจสอบ'].map(function(x){return '<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div></article>'}).join('')+'</div>'+empty}function ops(){var rows=['1','2','3','4'].map(function(){return '<tr><td class="queue">คิวที่ —</td><td>—</td><td>เที่ยวที่ —</td><td>—</td><td>—</td><td><button class="action" data-service="1">ตั้งค่าสถานะ</button></td><td><button class="action" data-gps="1">ดู GPS / กล่องดำ</button></td></tr>'}).join('');return head('การเดินรถ / ตารางเที่ยวบริการ','คิวรถ เวลาออก และนโยบายการเผยแพร่ตำแหน่ง','สร้างเที่ยวบริการ')+'<div class="filters"><input class="field" type="date"><select class="field"><option>มุมมองรายวัน</option><option>มุมมองรายสัปดาห์</option></select><select class="field"><option>ทุกเส้นทาง</option></select><select class="field"><option>ทุกสถานะ</option></select></div><div class="kpis">'+['เที่ยวบริการวันนี้','เผยแพร่ตำแหน่งอยู่','ซ่อนตำแหน่ง','ปัญหา GPS'].map(function(x){return '<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div></article>'}).join('')+'</div><div class="filters"><button class="chip active">ทั้งหมด</button><button class="chip">เปิดให้บริการ</button><button class="chip">ปิดรับจอง</button><button class="chip">ซ่อนจากผู้โดยสาร</button><button class="chip">มีปัญหา GPS</button></div><section class="card"><div class="toolbar"><div><strong>ตารางคิวรถประจำวัน</strong><span class="label">การเผยแพร่จะทำงานตามช่วงเวลาของเที่ยวรถ</span></div><div class="actions"><button class="btn">ตรวจสอบข้อมูล</button><button class="btn primary">บันทึกฉบับร่าง</button></div></div><div class="schedule-wrap"><table class="ops-table"><thead><tr><th>คิวรถ</th><th>เวลาออก</th><th>เที่ยวรถ</th><th>ต้นทาง</th><th>ปลายทาง</th><th>สถานะการให้บริการ</th><th>สถานะ GPS / กล่องดำ</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="foot"><span>ค่าเริ่มต้น: ซ่อนตำแหน่งนอกช่วงเวลาเที่ยว</span><span>GPS อ่านจาก App / กล่องดำ</span></div></section><div class="lower"><section class="card detail"><h2>รายได้จากเที่ยวบริการ</h2>'+empty+'</section><section class="card detail"><h2>รายการปัญหา GPS / App</h2>'+empty+'</section></div>'}function data(){return head('จัดการข้อมูล','ตารางว่างจากแม่แบบ Excel สำหรับกรอกและแก้ไขข้อมูล')+'<div class="notice">ใช้เฉพาะหัวคอลัมน์จาก Excel ไม่มีข้อมูลตัวอย่าง</div>'+empty}var views={dashboard:dashboard,finance:finance,ops:ops,data:data,news:function(){return standard('อัพเดทข่าวสาร','สร้าง ตรวจสอบ และเผยแพร่ประกาศบนเว็บไซต์')},staff:function(){return standard('พนักงาน / สิทธิ์','จัดการผู้ใช้งานและสิทธิ์การเข้าถึง')},account:function(){return standard('ตั้งค่าบัญชี','จัดการโปรไฟล์และความปลอดภัย')},test:function(){return standard('โหมดทดสอบ','ควบคุมสภาพแวดล้อมสำหรับการทดสอบ')},logout:function(){return head('ออกจากระบบ','สิ้นสุด session ของผู้ใช้งานปัจจุบัน')}};function closeAll(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}function render(id){document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===id)});document.getElementById('content').innerHTML=views[id||'dashboard']();closeAll()}function openDrawer(html){document.getElementById('drawerBody').innerHTML=html;document.getElementById('drawer').classList.add('open')}document.addEventListener('click',function(e){var b=e.target.closest('[data-page]');if(b)render(b.dataset.page);if(e.target.closest('[data-service]'))openDrawer('<h2>นโยบายการเผยแพร่ตำแหน่ง</h2><p class="label">ตั้งค่าเฉพาะเที่ยวและคิวนี้ โดยค่าเริ่มต้นเป็นซ่อนตำแหน่ง</p><div class="grid"><div class="cell"><small>สถานะบริการ</small><select class="field"><option>เปิดให้บริการ</option><option>ปิดรับจอง</option><option>ยกเลิกเที่ยว</option></select></div><div class="cell"><small>สถานะการเผยแพร่</small><select class="field"><option>ซ่อนตำแหน่ง</option><option>เผยแพร่ตามเวลา</option><option>เผยแพร่ทันที</option></select></div><div class="cell"><small>เวลาเริ่มเผยแพร่</small><input class="field" type="time"></div><div class="cell"><small>เวลาหยุดเผยแพร่</small><input class="field" type="time"></div></div><h3>ช่องทางการเผยแพร่</h3><div class="notice"><label><input type="checkbox"> Passenger</label><br><label><input type="checkbox"> เว็บไซต์</label><br><label><input type="checkbox" checked> Admin ERP</label></div><p class="label">การเปลี่ยนแปลงจะอยู่ในฉบับร่างจนกว่าจะตรวจสอบและเผยแพร่</p><button class="btn primary">บันทึกฉบับร่าง</button>');if(e.target.closest('[data-gps]'))openDrawer('<h2>สถานะ GPS / กล่องดำ</h2><p class="label">ข้อมูลจาก Driver App หรืออุปกรณ์ติดตาม ไม่ใช่สถานะที่ Admin กรอกเอง</p><div class="notice">ยังไม่มีข้อมูลตำแหน่งจริง</div><div class="grid"><div class="cell"><small>เวลารับข้อมูลล่าสุด</small>—</div><div class="cell"><small>ตำแหน่งล่าสุด</small>—</div><div class="cell"><small>สถานะ App</small>—</div><div class="cell"><small>รายงานปัญหา</small>—</div></div>')});document.getElementById('menu').onclick=function(){document.getElementById('side').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')};document.getElementById('overlay').onclick=closeAll;document.getElementById('close').onclick=function(){document.getElementById('drawer').classList.remove('open')};document.getElementById('theme').onclick=function(){var d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';this.textContent=d.dataset.theme==='dark'?'Dark':'Light'};render('dashboard');</script></body></html>
