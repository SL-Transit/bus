<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SL-Transit Admin ERP</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#18324d;--muted:#71849a;--line:#dbe5ef;--nav:#082b4d;--blue:#1677c8;--teal:#09a4ad;--soft:#eef6fc;--warn:#a35e00}
    html[data-theme=dark]{--bg:#0d1b2a;--panel:#14283a;--ink:#e9f2fa;--muted:#91a9bc;--line:#2b455b;--nav:#071726;--soft:#19344a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Noto Sans Thai",Arial,sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);padding:20px 14px;color:#d9e8f5}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px;border-bottom:1px solid #fff2}.brand img{width:52px;height:40px;object-fit:contain;background:#fff;border-radius:7px}.brand strong{display:block;color:#fff}.brand small{font-size:10px;color:#9eb9ce}.nav{display:grid;gap:6px;margin-top:24px}.nav button{border:0;background:transparent;color:#c4d6e5;text-align:left;border-radius:8px;padding:11px 12px;cursor:pointer}.nav button.active{background:#15639a;color:#fff;border-left:3px solid var(--teal)}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top-left,.top-right,.actions,.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.menu{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px;cursor:pointer}.menu i,.menu i:before,.menu i:after{display:block;height:2px;background:var(--ink);content:"";position:relative}.menu i:before{position:absolute;top:-7px;width:100%}.menu i:after{position:absolute;top:7px;width:100%}.search,.field{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 12px}.search{width:330px}.icon,.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px 12px;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:700}.content{max-width:1600px;margin:auto;padding:28px}.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}.head{display:flex;justify-content:space-between;gap:18px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:29px}.head p{margin:0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 22px #16446d0d}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}.kpi{padding:18px;min-height:115px}.label{color:var(--muted)}.value{font-size:28px;font-weight:750;margin-top:8px}.filters{margin-bottom:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}.tabs button.active{background:var(--soft);color:var(--blue);border-color:#85bdf0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}.toolbar strong{display:block;font-size:16px}.toolbar .label{display:block;margin-top:3px;font-size:12px}.table-wrap{overflow:auto;max-height:590px}.table{border-collapse:separate;border-spacing:0;min-width:1230px;width:100%;font-size:12px}.table th,.table td{border-bottom:1px solid var(--line);padding:15px 16px;white-space:nowrap;text-align:left;line-height:1.45}.table th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--muted);font-weight:650}.table thead tr:first-child th{text-align:center;padding-top:12px;padding-bottom:10px}.table thead tr:nth-child(2) th{top:39px;font-size:11px}.table tbody tr{height:70px}.table tbody tr:hover{background:var(--soft)}.table th:first-child,.table td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}.table th:first-child{z-index:3;background:var(--soft)}.table tbody tr:hover td:first-child{background:var(--soft)}.table .primary-cell strong{display:block;font-weight:650}.table .sub{display:block;color:var(--muted);font-size:11px;margin-top:3px}.table .num{text-align:right;font-variant-numeric:tabular-nums}.money{font-weight:700;color:var(--teal)}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}.status.ready:before{background:var(--teal)}.action{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--blue);padding:8px 10px;cursor:pointer}.table-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 20px;color:var(--muted);font-size:12px}.notice{padding:13px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}.empty{min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink)}.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.detail{padding:18px}.detail h2{font-size:16px;margin-top:0}.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;background:var(--panel);z-index:40;box-shadow:-12px 0 35px #061a2b33;transform:translateX(100%);transition:.2s;padding:22px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-close{float:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.cell{border:1px solid var(--line);border-radius:8px;padding:10px}.cell small{display:block;color:var(--muted);margin-bottom:4px}.overlay{display:none}
    @media(max-width:900px){.app{grid-template-columns:190px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.app{display:block}.side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:.2s;display:block}.side.open{transform:translateX(0)}.menu{display:block}.overlay.show{display:block;position:fixed;inset:0;background:#061a2b66;z-index:20}.top{height:60px;padding:0 14px}.search{width:190px}.content{padding:16px 12px}.head{display:block}.actions{margin-top:14px}.lower{grid-template-columns:1fr}.drawer{width:min(430px,92vw)}.table-footer{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="app"><aside class="side" id="side"><div class="brand"><img src="assets/sl-transit-logo-admin.jpg" alt="SL-Transit"><div><strong>SL-TRANSIT</strong><small>ADMIN ERP CONSOLE</small></div></div><nav class="nav" id="nav"></nav></aside><div class="overlay" id="overlay"></div><main><header class="top"><div class="top-left"><button class="menu" id="menu" aria-label="เปิดเมนู"><i></i></button><input class="search" placeholder="ค้นหาในระบบ"></div><div class="top-right"><button class="icon" id="theme">Light</button><div class="avatar">A</div></div></header><section class="content" id="content"></section></main></div>
  <aside class="drawer" id="drawer"><button class="btn drawer-close" id="close">ปิด</button><div id="drawerBody"></div></aside>
  <script>
    const pages=[['dashboard','แดชบอร์ด'],['finance','รายได้ / จอง / ยกเลิก'],['ops','การเดินรถ / ตารางเที่ยวบริการ'],['data','จัดการข้อมูล'],['news','อัพเดทข่าวสาร'],['staff','พนักงาน / สิทธิ์'],['account','ตั้งค่าบัญชี'],['test','โหมดทดสอบ'],['logout','ออกจากระบบ']];
    const nav=document.getElementById('nav'); pages.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.page=id;nav.appendChild(b)});
    const empty='<div class="empty"><div><strong>ยังไม่มีข้อมูลให้แสดง</strong><span>หน้านี้พร้อมใช้งานเมื่อเชื่อมต่อแหล่งข้อมูลที่ยืนยันแล้ว</span></div></div>';
    function head(t,d,a){return `<div class="crumb">SL-Transit / Admin ERP</div><div class="head"><div><h1>${t}</h1><p>${d}</p></div>${a?`<button class="btn primary">${a}</button>`:''}</div>`}
    function standard(t,d){return head(t,d)+`<section class="card">${empty}</section>`}
    function dashboard(){return head('แดชบอร์ด','ภาพรวมการดำเนินงานของ SL-Transit','รีเฟรชข้อมูล')+`<div class="kpis">${['รายได้วันนี้','การจองวันนี้','ยกเลิกวันนี้','เที่ยวบริการวันนี้'].map(x=>`<article class="card kpi"><div class="label">${x}</div><div class="value">—</div></article>`).join('')}</div>${empty}`}
    function finance(){const rows=Array.from({length:5},()=>`<tr><td class="primary-cell"><strong>ยังไม่มีข้อมูล</strong><span class="sub">รอการเชื่อมต่อ Booking</span></td><td><span class="sub">คิวรถ</span>—</td><td><span class="sub">เที่ยวรถ</span>—</td><td><span class="sub">vehicle</span>—</td><td class="num money">—</td><td class="num money">—</td><td class="num money">—</td><td class="num money">—</td><td><span class="status">รอตรวจสอบ</span></td><td><button class="action" data-settlement="1">ดูรายละเอียด</button></td></tr>`).join('');return head('รายได้และการกระจายยอด','จัดการยอดจอง รายได้รถ กลุ่มคิว และค่าบริการ SL-Transit','ส่งออกข้อมูล')+`<div class="kpis">${['ยอดจองรวม','ส่วนของรถ','ส่วนกลุ่มคิว','ส่วน SL-Transit'].map(x=>`<article class="card kpi"><div class="label">${x}</div><div class="value">—</div><span class="label">ยังไม่มีข้อมูลจริง</span></article>`).join('')}</div><div class="filters"><input class="field" type="date"><select class="field"><option>ทุกสถานะการจ่าย</option></select><select class="field"><option>ทุกกลุ่มคิว</option></select><button class="btn">กระทบยอด</button></div><div class="tabs"><button class="active">การกระจายยอด</button><button>รายการจอง</button><button>รอบการจ่ายเงิน</button><button>ยกเลิก / คืนเงิน</button></div><section class="card"><div class="toolbar"><div><strong>Settlement Ledger</strong><span class="label">แยกยอดตาม booking, trip, vehicle และ payment</span></div><button class="btn primary">สร้างรอบจ่าย</button></div><div class="table-wrap"><table class="table"><thead><tr><th rowspan="2">Booking</th><th rowspan="2">คิวรถ</th><th rowspan="2">เที่ยวรถ</th><th rowspan="2">รถ</th><th colspan="4">ยอดการกระจาย</th><th rowspan="2">สถานะ</th><th rowspan="2"></th></tr><tr><th class="num">ยอดจอง</th><th class="num">ส่วนรถ</th><th class="num">ส่วนกลุ่มคิว</th><th class="num">ส่วนบริษัท</th></tr></thead><tbody>${rows}</tbody></table></div><div class="table-footer"><span>แสดง — รายการ · ยังไม่เชื่อมต่อแหล่งข้อมูล</span><span>หน้า —</span></div></section><div class="lower"><section class="card detail"><h2>สถานะการจ่ายเงิน</h2><div class="notice">ชำระเงินแล้ว → กันยอดไว้ → พร้อมกระจาย → รอจ่าย → จ่ายแล้ว</div></section><section class="card detail"><h2>การกระทบยอด</h2><div class="notice">ยังไม่มีข้อมูล Payment หรือรายการคืนเงิน</div></section></div>`}
    const views={dashboard,finance,ops:()=>head('การเดินรถ / ตารางเที่ยวบริการ','คิวรถ เวลาออก และนโยบายการเผยแพร่ตำแหน่ง','สร้างเที่ยวบริการ')+empty,data:()=>head('จัดการข้อมูล','ตารางว่างจากแม่แบบ Excel สำหรับกรอกและแก้ไขข้อมูล')+'<div class="notice">ใช้เฉพาะหัวคอลัมน์จาก Excel ไม่มีข้อมูลตัวอย่าง</div>'+empty,news:()=>standard('อัพเดทข่าวสาร','สร้าง ตรวจสอบ และเผยแพร่ประกาศบนเว็บไซต์'),staff:()=>standard('พนักงาน / สิทธิ์','จัดการผู้ใช้งานและสิทธิ์การเข้าถึง'),account:()=>standard('ตั้งค่าบัญชี','จัดการโปรไฟล์และความปลอดภัย'),test:()=>standard('โหมดทดสอบ','ควบคุมสภาพแวดล้อมสำหรับการทดสอบ'),logout:()=>head('ออกจากระบบ','สิ้นสุด session ของผู้ใช้งานปัจจุบัน')};
    function closeAll(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
    function render(id){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById('content').innerHTML=views[id||'dashboard']();closeAll()}
    function openDrawer(){document.getElementById('drawerBody').innerHTML='<h2>รายละเอียดการกระจายยอด</h2><p class="label">แยกเงินจากการจองหนึ่งรายการให้ผู้เกี่ยวข้องหลายฝ่าย</p><div class="grid">'+['ยอดที่ผู้โดยสารชำระ','ส่วนของรถ','ส่วนกลุ่มคิว','ส่วน SL-Transit','ค่าธรรมเนียมชำระเงิน','เงินคืน'].map(x=>`<div class="cell"><small>${x}</small>—</div>`).join('')+'</div><div class="notice">ยังไม่ใช่การโอนเงินจริง และยังไม่เชื่อมต่อ Payment</div><h3>สถานะ</h3><select class="field"><option>รอตรวจสอบ</option><option>พร้อมกระจายยอด</option><option>รอจ่าย</option><option>จ่ายแล้ว</option></select>';document.getElementById('drawer').classList.add('open')}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)render(b.dataset.page);if(e.target.closest('[data-settlement]'))openDrawer()});document.getElementById('menu').onclick=()=>{document.getElementById('side').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')};document.getElementById('overlay').onclick=closeAll;document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('theme').onclick=function(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';this.textContent=d.dataset.theme==='dark'?'Dark':'Light'};render('dashboard');
  </script>
  <script>
    views.ops=function(){
      const rows=Array.from({length:6},()=>`<tr><td class="primary-cell"><strong>ยังไม่มีข้อมูล</strong><span class="sub">รอการเชื่อมต่อคิวรถ</span></td><td class="primary-cell"><strong>—</strong><span class="sub">เวลาออกตามตาราง</span></td><td>—</td><td>—</td><td>—</td><td><span class="status">ยังไม่เปิดเผย</span><span class="sub">ตั้งเวลาเผยแพร่ได้</span></td><td><span class="status">รอข้อมูล GPS</span><span class="sub">กล่องดำ / แอปคนขับ</span></td><td><button class="action">ดูรายละเอียด</button></td></tr>`).join('');
      return head('การเดินรถ / ตารางเที่ยวบริการ','จัดการคิวรถ เวลาออก และช่วงเวลาการแสดงตำแหน่งบน Passenger','สร้างเที่ยวบริการ')+`<div class="filters"><input class="field" type="date"><select class="field"><option>ทุกสถานะเที่ยวบริการ</option></select><select class="field"><option>ทุกสถานะ GPS</option></select><button class="btn">รีเฟรชสถานะ</button></div><section class="card"><div class="toolbar"><div><strong>ตารางคิวรถวันนี้</strong><span class="label">คิวรถเป็นตารางงานที่กำหนดไว้ รถเป็นทรัพยากรที่เข้าร่วมให้บริการ</span></div><div class="actions"><button class="btn">ขอเปลี่ยนรถ</button><button class="btn primary">เพิ่มเที่ยวบริการ</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>คิวรถ</th><th>เวลาออก</th><th>เที่ยวรถ</th><th>ต้นทาง</th><th>ปลายทาง</th><th>สถานะการเผยแพร่</th><th>สถานะ GPS / กล่องดำ</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="table-footer"><span>แสดง — เที่ยว · ไม่มีข้อมูลจริงในโหมดออกแบบ</span><span>มุมมองวันนี้ · —</span></div></section><div class="lower"><section class="card detail"><h2>นโยบายการแสดงตำแหน่ง</h2><div class="notice">แสดงตำแหน่งเฉพาะช่วงเวลาของเที่ยวที่เปิดให้บริการ และซ่อนอัตโนมัตินอกช่วงเวลา</div></section><section class="card detail"><h2>สถานะการประสานงาน</h2><div class="notice">รถเป็นผู้ให้บริการภายนอก ระบบจะแสดงสถานะและส่งคำขอ ไม่ใช่คำสั่งปฏิบัติงาน</div></section></div>`;
    };
  </script>
  <script>
    const opsStyle=document.createElement('style');opsStyle.textContent='.ops-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.ops-mini{padding:15px;min-height:96px}.ops-mini .value{font-size:24px}.schedule-table{min-width:1280px}.schedule-table th,.schedule-table td{padding:15px 16px}.schedule-table .route-cell strong{display:block}.schedule-table .route-cell span,.schedule-table .sub{display:block;color:var(--muted);font-size:11px;margin-top:3px}.schedule-table .num{text-align:right;font-variant-numeric:tabular-nums}.switch{width:42px;height:24px;border:1px solid var(--line);border-radius:20px;background:var(--bg);position:relative;display:inline-block;vertical-align:middle}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:2px;border-radius:50%;background:var(--muted)}.switch.on{background:#dff6f3;border-color:#8bd8ce}.switch.on:after{left:19px;background:var(--teal)}.stop-panel{background:var(--bg);border-top:1px solid var(--line);padding:16px 20px}.stop-panel h3{margin:0 0 12px;font-size:14px}.stop-grid{display:grid;grid-template-columns:36px 1.5fr 90px 90px 110px 110px 110px;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}.stop-grid>div{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:12px}.stop-grid>div:nth-last-child(-n+7){border-bottom:0}.stop-grid .grid-head{background:var(--soft);color:var(--muted);font-weight:650}.booking-rule{display:grid;grid-template-columns:1fr 1fr;gap:12px}.booking-rule label{display:grid;gap:5px;color:var(--muted);font-size:12px}.booking-rule .field{width:100%}.rule-box{margin-top:16px;padding:15px;border:1px solid var(--line);border-radius:9px}.rule-box h3{margin:0 0 12px;font-size:14px}.rule-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rule-line:last-child{border-bottom:0}.rule-line strong{f       if(text==='สร้างบทบาท') openDrawer('<h2>สร้างบทบาท</h2><label class="field-label">ชื่อบทบาท<input class="field" placeholder="เช่น Operations Manager"></label><div class="impact-list"><div><span>ดูข้อมูล</span><strong>เปิด</strong></div><div><span>แก้ไข</span><strong>เลือกภายหลัง</strong></div><div><span>ตรวจสอบ</span><strong>เลือกภายหลัง</strong></div><div><span>เผยแพร่</span><strong>เลือกภายหลัง</strong></div></div><div class="content-actions"><button class="btn primary">บันทึกฉบับร่าง</button></div>');
      if(text==='แก้ไข') openDrawer('<h2>แก้ไขบทบาท</h2><p class="label">ปรับสิทธิ์ตามหน้าที่ของบทบาทนี้</p><div class="impact-list"><div><span>Dashboard</span><strong>ดู</strong></div><div><span>จัดการข้อมูล</span><strong>—</strong></div><div><span>ประกาศ</span><strong>—</strong></div></div><div class="content-actions"><button class="btn primary">บันทึกฉบับร่าง</button></div><div class="notice">ต้องผ่านการตรวจสอบก่อนใช้งาน</div>');
      if(text==='ดูสมาชิก') openDrawer('<h2>สมาชิกทีม</h2><p class="label">รายชื่อสมาชิกของทีมนี้</p><div class="empty"><div><strong>ยังไม่มีสมาชิก</strong><span>เพิ่มสมาชิกจากคำเชิญ</span></div></div>');
    });
  </script>
  <script>

      const btn=e.target.closest('button');if(!btn)return;const text=btn.textContent.trim();
      if(text==='ดูรายละเอียด') openDrawer('<h2>รายละเอียดคิวรถ</h2><div class="impact-list"><div><span>คิวรถ</span><strong>—</strong></div><div><span>เวลาออก</span><strong>—</strong></div><div><span>ต้นทาง → ปลายทาง</span><strong>—</strong></div><div><span>สถานะ GPS</span><strong>—</strong></div></div><div class="notice">ข้อมูลจะมาจาก ERP Data Center เมื่อเชื่อมต่อจริง</div>');
      if(text==='สร้างเที่ยวรถ'||text==='เพิ่มรอบเวลา') openDrawer('<h2>'+text+'</h2><div class="booking-rule"><label>กลุ่มคิวรถ<select class="field"><option>เลือกกลุ่มคิว</option></select></label><label>เวลาออก<input class="field" type="time"></label><label>ต้นทาง<input class="field" placeholder="เลือกป้ายต้นทาง"></label><label>ปลายทาง<input class="field" placeholder="เลือกป้ายปลายทาง"></label></div><div class="content-actions"><button class="btn primary">บันทึกฉบับร่าง</button></div><div class="notice">ยังไม่สร้างเที่ยวหรือรอบเวลาจริง</div>');

  <script>
    document.addEventListener('click',function(e){
      const title=document.querySelector('#content .head h1');
      if(!title || title.textContent!=='โหมดทดสอบและเผยแพร่') return;

  <style>
    .test-mode-layer{position:fixed;inset:0;z-index:100;background:rgba(3,18,32,.48);display:grid;place-items:center;padding:18px}.test-mode-dialog{width:min(470px,100%);background:var(--panel);color:var(--ink);border:1px solid #e3b45c;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.25);padding:22px}.test-mode-dialog .test-kicker{color:#9b6506;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.test-mode-dialog h2{margin:6px 0 5px;font-size:20px}.test-mode-dialog p{margin:0;color:var(--muted);font-size:12px}.test-mode-list{display:grid;gap:8px;margin:16px 0}.test-mode-list div{display:flex;justify-content:space-between;gap:12px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px}.test-mode-list span{color:#9b6506;font-weight:700}.test-mode-dialog .btn{width:100%}.test-mode-banner{position:sticky;top:0;z-index:15;padding:7px 12px;background:#fff3d6;color:#8a5700;border-bottom:1px solid #f0c77d;font-size:11px;font-weight:700;text-align:center}.test-mode-topbar{display:inline-flex;align-items:center;gap:7px;border:1px solid #e3b45c;border-radius:999px;background:#fff3d6;color:#8a5700;padding:7px 11px;font-size:11px;font-weight:800;white-space:nowrap}.test-mode-topbar:before{content:"";width:7px;height:7px;border-radius:50%;background:#d38a13;box-shadow:0 0 0 3px #f6ddb0}
    html[data-theme=dark] .test-mode-banner,html[data-theme=dark] .test-mode-topbar{background:#3b2b12;color:#f2c66c;border-color:#8e6823}.test-mode-topbar[hidden]{display:none}
    @media(max-width:700px){.top-left{min-width:0;flex:1;flex-wrap:nowrap;gap:6px}.top-left .search{min-width:0;width:clamp(108px,38vw,165px)}.test-mode-topbar{max-width:82px;overflow:hidden;text-overflow:ellipsis;padding:6px 8px;font-size:10px}body.test-mode-on .top-left .search{width:clamp(92px,30vw,132px)}}
  </style>
  <script>
    (function(){
      var testModeActive=sessionStorage.getItem('slTransitTestMode')==='on', popupOpen=false;
      window.__slTestModeActive=testModeActive;
      function showTestPopup(){
        if(popupOpen)return; popupOpen=true;
        var layer=document.createElement('div');layer.className='test-mode-layer';layer.id='testModeLayer';
        layer.innerHTML='<section class="test-mode-dialog" role="dialog" aria-modal="true"><div class="test-kicker">SL-Transit · Test Mode</div><h2>กำลังอยู่ในโหมดทดสอบ</h2><p>คุณกำลังทดสอบระบบผ่านคอมพิวเตอร์ ข้อมูลและการทำรายการจะไม่ส่งผลจริง</p><div class="test-mode-list"><div><strong>การชำระเงินจริง</strong><span>ปิด</span></div><div><strong>บริการที่มีค่าใช้จ่าย</strong><span>ปิด</span></div><div><strong>การแจ้งเตือนภายนอก</strong><span>ปิด</span></div><div><strong>ข้อมูล Production</strong><span>ห้ามเขียน</span></div></div><button class="btn primary" id="testModeAcknowledge">รับทราบและเริ่มทดสอบ</button></section>';
        document.body.appendChild(layer);document.getElementById('testModeAcknowledge').onclick=function(){layer.remove();popupOpen=false};
      }
      function syncTopbar(){
        var topLeft=document.querySelector('.top-left');if(!topLeft)return;
        var badge=document.getElementById('testModeTopbar');
        if(!badge){badge=document.createElement('span');badge.id='testModeTopbar';badge.className='test-mode-topbar';badge.setAttribute('role','status');badge.textContent='โหมดทดสอบ';topLeft.insertBefore(badge,topLeft.querySelector('.search')||null)}
        badge.hidden=!testModeActive;document.body.classList.toggle('test-mode-on',testModeActive);
      }
      function syncTestMode(){
        var title=document.querySelector('#content .head h1');
        if(title&&title.textContent==='โหมดทดสอบและเผยแพร่'){
          var toggle=document.querySelector('#content .banner .switch-control');
          if(toggle&&!toggle.dataset.testBound){toggle.dataset.testBound='1';toggle.addEventListener('click',function(){setTimeout(function(){testModeActive=toggle.classList.contains('is-on');window.__slTestModeActive=testModeActive;sessionStorage.setItem('slTransitTestMode',testModeActive?'on':'off');if(testModeActive)showTestPopup()},0)})}
        }
        syncTopbar();
        if(testModeActive){if(!document.querySelector('.test-mode-banner')){var b=document.createElement('div');b.className='test-mode-banner';b.textContent='TEST MODE · ปิดการชำระเงินจริง บริการมีค่าใช้จ่าย และการเขียนข้อมูล Production';document.querySelector('main').prepend(b)}showTestPopup()}
        else {var b=document.querySelector('.test-mode-banner');if(b)b.remove()}
      }
      new MutationObserver(syncTestMode).observe(document.getElementById('content'),{childList:true,subtree:true});
      setTimeout(syncTestMode,0);
    })();
  </script>
