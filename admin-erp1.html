<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL-Transit Admin ERP</title><style>:root{--bg:#f4f7fb;--panel:#fff;--ink:#18324d;--muted:#71849a;--line:#dbe5ef;--nav:#082b4d;--blue:#1677c8;--teal:#09a4ad;--soft:#eef6fc;--warn:#a35e00}html[data-theme=dark]{--bg:#0d1b2a;--panel:#14283a;--ink:#e9f2fa;--muted:#91a9bc;--line:#2b455b;--nav:#071726;--soft:#19344a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Noto Sans Thai",Arial,sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);padding:20px 14px;color:#d9e8f5}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px;border-bottom:1px solid #fff2}.brand img{width:52px;height:40px;object-fit:contain;background:#fff;border-radius:7px}.brand strong{display:block;color:#fff}.brand small{font-size:10px;color:#9eb9ce}.nav{display:grid;gap:6px;margin-top:24px}.nav button{border:0;background:transparent;color:#c4d6e5;text-align:left;border-radius:8px;padding:11px 12px}.nav button.active{background:#15639a;color:#fff;border-left:3px solid var(--teal)}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top-left,.top-right,.actions,.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.menu{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px}.menu i,.menu i:before,.menu i:after{display:block;height:2px;background:var(--ink);content:"";position:relative}.menu i:before{position:absolute;top:-7px;width:100%}.menu i:after{position:absolute;top:7px;width:100%}.search,.field{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 12px}.search{width:330px}.icon{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 11px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:700}.content{max-width:1600px;margin:auto;padding:28px}.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}.head{display:flex;justify-content:space-between;gap:18px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:29px}.head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px 14px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 22px #16446d0d}.notice{padding:13px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);background:var(--bg)}.empty{min-height:190px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}.kpi{padding:18px;min-height:115px}.label{color:var(--muted)}.value{font-size:28px;font-weight:750;margin-top:8px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 11px;color:var(--muted)}.chip.active{background:var(--soft);color:var(--blue);border-color:#85bdf0}.schedule-wrap{overflow:auto}.schedule{border-collapse:separate;border-spacing:0;min-width:1080px;width:100%;font-size:12px}.schedule th,.schedule td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;white-space:nowrap}.schedule thead th{background:var(--soft);color:var(--muted);position:sticky;top:0;z-index:2}.schedule .vehicle{position:sticky;left:0;background:var(--panel);z-index:3;min-width:170px}.slot{min-width:170px;height:80px;vertical-align:top}.job{border-left:4px solid var(--teal);border-radius:7px;background:color-mix(in srgb,var(--teal) 10%,var(--panel));padding:8px;cursor:pointer}.job.warn{border-color:#e19a31;background:#fff8eb}.job strong{display:block;color:var(--ink)}.job span{display:block;color:var(--muted);font-size:11px}.revenue{font-weight:700;color:var(--teal);min-width:110px}.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}.drawer{position:fixed;top:0;right:0;bottom:0;width:390px;background:var(--panel);box-shadow:-12px 0 35px #061a2b33;z-index:30;transform:translateX(100%);transition:transform .2s;padding:22px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer h2{margin:0 0 4px}.drawer-close{float:right}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detail-cell{padding:11px;border:1px solid var(--line);border-radius:8px}.detail-cell small{display:block;color:var(--muted);margin-bottom:3px}.overlay{display:none}.sheet{border-collapse:collapse;width:100%;min-width:900px;font-size:12px}.sheet th,.sheet td{border:1px solid var(--line);padding:10px;min-width:130px;text-align:left}.sheet th{background:var(--soft);color:var(--muted)}.edit{height:38px}.edit:focus{outline:2px solid var(--blue);outline-offset:-2px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 12px}.tabs button.active{background:var(--soft);color:var(--blue)}.workflow{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:16px}.step{padding:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}.step strong{display:block;color:var(--ink)}.step.active{box-shadow:inset 0 -3px var(--blue);background:var(--soft)}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:.2s;display:block}.side.open{transform:translateX(0)}.menu{display:block}.overlay.show{display:block;position:fixed;inset:0;background:#061a2b66;z-index:20}.top{height:60px;padding:0 14px}.search{width:190px}.content{padding:16px 12px}.head{display:block}.head .actions{margin-top:14px}.drawer{width:min(390px,92vw)}.toolbar{display:block}.toolbar>div+div{margin-top:10px}.workflow{grid-template-columns:repeat(4,160px);overflow:auto}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><img src="assets/sl-transit-logo-admin.jpg" alt="SL-Transit"><div><strong>SL-TRANSIT</strong><small>ADMIN ERP CONSOLE</small></div></div><nav class="nav" id="nav"></nav></aside><div class="overlay" id="overlay"></div><main><header class="top"><div class="top-left"><button class="menu" id="menu" aria-label="เปิดเมนู"><i></i></button><input class="search" placeholder="ค้นหาในระบบ"></div><div class="top-right"><button class="icon" id="theme">Light</button><div class="avatar">A</div></div></header><section class="content" id="content"></section></main></div><aside class="drawer" id="drawer"><button class="btn drawer-close" id="drawerClose">ปิด</button><div id="drawerContent"></div></aside><script>const pages=[['dashboard','แดชบอร์ด'],['finance','รายได้ / จอง / ยกเลิก'],['ops','ปฏิบัติงาน / คิวรถ'],['data','จัดการข้อมูล'],['news','อัพเดทข่าวสาร'],['staff','พนักงาน / สิทธิ์'],['account','ตั้งค่าบัญชี'],['test','โหมดทดสอบ'],['logout','ออกจากระบบ']];const nav=document.querySelector('#nav');pages.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.page=id;nav.appendChild(b)});const empty='<div class="empty"><div><strong>ยังไม่มีข้อมูลให้แสดง</strong><span>หน้าจอนี้จะพร้อมเมื่อเชื่อมต่อแหล่งข้อมูลที่ยืนยันแล้ว</span></div></div>';const head=(t,d,a='')=>'<div class="crumb">SL-Transit / Admin ERP</div><div class="head"><div><h1>'+t+'</h1><p>'+d+'</p></div>'+(a?'<div class="actions"><button class="btn primary">'+a+'</button></div>':'')+'</div>';function standard(t,d,a){return head(t,d,a)+'<section class="card">'+empty+'</section>'}function dashboard(){return head('แดชบอร์ด','ภาพรวมการดำเนินงานของ SL-Transit','รีเฟรชข้อมูล')+'<div class="kpis">'+['รายได้วันนี้','การจองวันนี้','ยกเลิกวันนี้','เที่ยวบริการวันนี้'].map(x=>'<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div><span class="label">ยังไม่เชื่อมต่อข้อมูลจริง</span></article>').join('')+'</div>'+empty}function finance(){return head('รายได้ / จอง / ยกเลิก','ตรวจสอบรายได้และสถานะการจอง','ส่งออกข้อมูล')+'<div class="kpis">'+['ยอดจองรวม','ชำระแล้ว','คืนเงิน','รอตรวจสอบ'].map(x=>'<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div><span class="label">ยังไม่มีข้อมูลจริง</span></article>').join('')+'</div><div class="tabs"><button class="active">ภาพรวม</button><button>รายการจอง</button><button>ยกเลิก / คืนเงิน</button></div><section class="card"><div class="notice">กราฟและรายการจะแสดงเมื่อเชื่อมต่อ Booking และ Payment adapter</div>'+empty+'</section>'}const sheetCols=['รหัสรอบ (trip_id)','รหัสเส้นทาง (route_id)','ต้นทาง','ปลายทาง','เวลาออก','เปิดจอง','จำนวนคนสูงสุด'];function data(){return head('จัดการข้อมูล','ตารางว่างจากแม่แบบ Excel สำหรับกรอกและแก้ไขข้อมูล')+'<div class="notice">ใช้เฉพาะหัวคอลัมน์จาก Excel ไม่มีข้อมูลตัวอย่างและยังไม่เชื่อมต่อแหล่งข้อมูล</div><div class="tabs"><button class="active">ป้ายต้นทาง</button><button>เส้นทาง</button><button>ราคา</button><button>รอบเวลา</button><button>คิวรถ</button></div><div class="workflow"><div class="step active"><strong>Draft</strong>ฉบับร่าง</div><div class="step"><strong>Validate</strong>ตรวจสอบข้อมูล</div><div class="step"><strong>Review</strong>รอตรวจทาน</div><div class="step"><strong>Publish</strong>เผยแพร่</div></div><section class="card"><div class="toolbar"><select class="field"><option>04_รอบเวลา</option></select><div><button class="btn">นำเข้า Excel</button><button class="btn">ส่งออก</button><button class="btn primary">บันทึกฉบับร่าง</button></div></div><div class="schedule-wrap"><table class="sheet"><thead><tr>'+sheetCols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+Array.from({length:8},()=>'<tr>'+sheetCols.map((_,i)=>'<td class="edit" '+(i===1?'':'contenteditable="true"')+'></td>').join('')+'</tr>').join('')+'</tbody></table></div></section></div>'}function ops(){return head('ปฏิบัติงาน / คิวรถ','ตารางเวลางานของรถและคิวที่ได้รับมอบหมาย','สร้างคิวงาน')+'<div class="filters"><input class="field" type="date"><select class="field"><option>มุมมองรายวัน</option><option>มุมมองรายสัปดาห์</option></select><select class="field"><option>ทุกเส้นทาง</option></select><select class="field"><option>รถทุกคัน</option></select></div><div class="kpis">'+['เที่ยววันนี้','รถที่มีคิว','คิวที่ยังว่าง','รายได้รอตรวจสอบ'].map(x=>'<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div><span class="label">ยังไม่เชื่อมต่อข้อมูลจริง</span></article>').join('')+'</div><div class="chips"><button class="chip active">ทั้งหมด</button><button class="chip">พร้อมออก</button><button class="chip">กำลังเดินทาง</button><button class="chip">ล่าช้า</button><button class="chip">ต้องสลับรถ</button></div><section class="card"><div class="toolbar"><div><strong>ตารางงานรถประจำวัน</strong><span class="label">คิวคือเวลา รถคือผู้รับผิดชอบ</span></div><div><button class="btn">ตรวจสอบ conflict</button><button class="btn primary">เผยแพร่ตาราง</button></div></div><div class="schedule-wrap"><table class="schedule"><thead><tr><th class="vehicle">รถ / กลุ่มคิว</th><th>08:00</th><th>09:00</th><th>10:00</th><th>11:00</th><th>12:00</th><th>รายได้จากการจอง</th></tr></thead><tbody>${['car / vehicle_id','car / vehicle_id','car / vehicle_id','car / vehicle_id'].map((x,r)=>'<tr><td class="vehicle"><strong>'+x+'</strong><span class="label">ยังไม่ได้เชื่อมต่อข้อมูล</span></td>'+[0,1,2,3,4].map((_,c)=>c===r?'<td class="slot"><div class="job" data-job="คิวงาน"><strong>คิวงานว่าง</strong><span>เวลาตามตาราง Excel</span><span>คลิกเพื่อจัดรถ</span></div></td>':'<td class="slot"></td>').join('')+'<td class="revenue">—</td></tr>').join('')}</tbody></table></div><div class="foot"><span>โหมดออกแบบ UI · ไม่มีข้อมูลการจองจริง</span><span>สลับรถได้เมื่อผ่านการตรวจเวลาชนและกลุ่มคิว</span></div></section><div class="lower"><section class="card detail"><h2>รายได้แยกตามรถ</h2>'+empty+'</section><section class="card detail"><h2>รายการ conflict</h2><div class="notice">ระบบจะแจ้งรถซ้ำ เวลาเหลื่อม และคิวที่ไม่ตรงกลุ่ม</div></section></div>'}const views={dashboard,finance,ops,data,news:()=>standard('อัพเดทข่าวสาร','สร้าง ตรวจสอบ และเผยแพร่ประกาศบนเว็บไซต์','สร้างข่าวสาร'),staff:()=>standard('พนักงาน / สิทธิ์','จัดการผู้ใช้งาน บทบาท และสิทธิ์การเข้าถึง','เชิญพนักงาน'),account:()=>standard('ตั้งค่าบัญชี','จัดการโปรไฟล์ ความปลอดภัย และการแจ้งเตือน'),test:()=>standard('โหมดทดสอบ','ควบคุมสภาพแวดล้อมสำหรับการทดสอบอย่างปลอดภัย'),logout:()=>head('ออกจากระบบ','สิ้นสุด session ของผู้ใช้งานปัจจุบัน')+'<section class="card detail"><h2>ต้องการออกจากระบบหรือไม่?</h2><div class="actions"><button class="btn">ยกเลิก</button><button class="btn primary">ออกจากระบบ</button></div></section>'};function render(id='dashboard'){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.querySelector('#content').innerHTML=views[id]();closeMenu()}function closeMenu(){document.querySelector('#side').classList.remove('open');document.querySelector('#overlay').classList.remove('show')}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)render(b.dataset.page);const job=e.target.closest('[data-job]');if(job){document.querySelector('#drawerContent').innerHTML='<h2>รายละเอียดคิวงาน</h2><p class="label">คิวนี้มีเวลางานกำหนดไว้จากตาราง ERP</p><div class="detail-grid"><div class="detail-cell"><small>รถปัจจุบัน</small>ยังไม่กำหนด</div><div class="detail-cell"><small>สถานะ</small>รอจัดรถ</div><div class="detail-cell"><small>เวลา</small>จากตารางคิว</div><div class="detail-cell"><small>รายได้จากการจอง</small>—</div></div><div class="notice">การสลับรถต้องตรวจเวลาชน กลุ่มคิว และสถานะรถก่อนบันทึก</div><div class="actions" style="margin-top:16px"><button class="btn">สลับรถ</button><button class="btn primary">บันทึกฉบับร่าง</button></div>';document.querySelector('#drawer').classList.add('open')}});document.querySelector('#menu').onclick=()=>{document.querySelector('#side').classList.toggle('open');document.querySelector('#overlay').classList.toggle('show')};document.querySelector('#overlay').onclick=closeMenu;document.querySelector('#drawerClose').onclick=()=>document.querySelector('#drawer').classList.remove('open');document.querySelector('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('#theme').textContent=d.dataset.theme==='dark'?'Dark':'Light'};render();</script></body></html>
