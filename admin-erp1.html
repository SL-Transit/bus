<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SL-Transit Admin ERP 1</title>
<style>
:root{--nav:#082b4d;--nav2:#0d4f83;--ink:#172b3f;--muted:#718096;--line:#e3eaf1;--canvas:#f4f7fa;--panel:#fff;--soft:#edf5fb;--blue:#1677c8;--teal:#12a7b7;--orange:#f28c28;--red:#c94a4a;--shadow:0 12px 30px rgba(16,44,73,.07)}
html[data-theme=dark]{--nav:#071b31;--nav2:#0c416c;--ink:#e9f1f8;--muted:#9fb2c4;--line:#284258;--canvas:#0d1d2d;--panel:#12283b;--soft:#173750;--blue:#4eb4ff;--teal:#36d0d1;--orange:#ffad4d;--red:#ff8585;--shadow:0 12px 30px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 "Segoe UI","Noto Sans Thai",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:#d9e8f5;padding:20px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 18px;border-bottom:1px solid #ffffff1f}.brand img{width:54px;height:40px;object-fit:contain;border-radius:8px}.brand strong{display:block;color:#fff;letter-spacing:.5px}.brand small{display:block;color:#9eb9ce;font-size:10px}.nav{display:grid;gap:5px}.nav button,.logout{border:0;background:transparent;color:#bfd3e5;text-align:left;border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav svg,.topbar svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-label{flex:1}.nav-section{color:#7696b1;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:11px 12px 3px}.logout{margin-top:auto;border:1px solid #ffffff2d}.main{min-width:0}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px}.top-left,.top-actions{display:flex;align-items:center;gap:12px}.menu{display:none}.search,.field{height:38px;border:1px solid var(--line);background:var(--canvas);border-radius:9px;padding:0 12px;color:var(--ink)}.search{width:330px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);display:grid;place-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff;font-weight:700}.content{padding:28px;max-width:1600px;margin:auto}.crumb{color:var(--muted);font-size:12px;margin-bottom:7px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.head h1{font-size:29px;margin:0 0 5px}.head p{margin:0;color:var(--muted)}.actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 14px}.primary{border-color:var(--blue);background:var(--blue);color:#fff}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.kpi{padding:18px;min-height:128px}.label{color:var(--muted);font-size:13px}.value{font-size:30px;font-weight:750;margin:8px 0 3px}.note{font-size:12px;color:var(--muted)}.two{grid-template-columns:1.55fr 1fr;margin-bottom:16px}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:16px;margin:0}.panel-body,.pad{padding:18px}.chart{height:255px;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 50px,var(--line) 51px);border-radius:8px;display:grid;place-items:center;overflow:hidden}.chart:before{content:"";position:absolute;inset:24px 22px;background:linear-gradient(135deg,transparent 0 15%,var(--teal) 15.3% 15.8%,transparent 16.1% 32%,var(--blue) 32.3% 32.8%,transparent 33.1% 55%,var(--teal) 55.3% 55.8%,transparent 56.1% 76%,var(--blue) 76.3% 76.8%,transparent 77%);opacity:.45}.empty{position:relative;z-index:1;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--panel) 90%,transparent);padding:16px 20px;border-radius:10px}.empty strong{display:block;color:var(--ink);margin-bottom:3px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--line) 0 100%);display:grid;place-items:center;margin:0 auto 13px}.donut:after{content:"";width:116px;height:116px;border-radius:50%;background:var(--panel)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);font-weight:650;background:var(--soft)}.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}.split{grid-template-columns:1fr 360px}.detail{padding:18px}.detail h3{margin:0 0 14px}.notice{padding:13px 15px;border:1px dashed var(--line);border-radius:9px;background:var(--soft);color:var(--muted);margin-bottom:15px}.settings{display:grid;grid-template-columns:220px 1fr;gap:18px}.settings-nav{display:grid;align-content:start;gap:4px}.settings-nav button{text-align:left;padding:11px;border:0;border-radius:8px;background:transparent;color:var(--muted)}.settings-nav button.active{background:var(--soft);color:var(--blue);font-weight:700}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-group{display:grid;gap:6px}.form-group label{font-size:12px;color:var(--muted)}.form-control{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 11px}.test-state{display:flex;align-items:center;justify-content:space-between;padding:18px;border:1px solid var(--line);border-radius:10px;margin-bottom:17px}.switch{width:48px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative}.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px}@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.two,.split{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}.side{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-100%);transition:.2s;z-index:10}.side.open{transform:translateX(0)}.menu{display:grid}.top{height:60px;padding:0 13px}.search{width:42px;font-size:0;padding:0}.search:before{content:"";display:block;width:17px;height:17px;margin:auto;border:1.8px solid currentColor;border-radius:50%;box-shadow:6px 6px 0 -5px currentColor}.content{padding:16px 12px}.head{display:block}.head .actions{margin-top:14px}.head h1{font-size:24px}.kpis{gap:10px}.kpi{padding:14px;min-height:110px}.value{font-size:24px}.two{gap:12px}.panel-body,.pad{padding:14px}.chart{height:230px}.form-grid,.settings{grid-template-columns:1fr}.settings-nav{display:flex;overflow:auto}.settings-nav button{white-space:nowrap}.table-wrap{margin:0 -14px}.table{min-width:630px}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"><div class="brand"><img src="assets/sl-transit-logo-admin.jpg" alt="SL-Transit"><div><strong>SL-TRANSIT</strong><small>ADMIN ERP CONSOLE</small></div></div><nav class="nav" id="nav"></nav><button class="logout" data-page="logout">ออกจากระบบ</button></aside><main class="main"><header class="top"><div class="top-left"><button class="icon-btn menu" id="menuBtn" aria-label="เปิดเมนู"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><input class="search" placeholder="ค้นหาในระบบ" aria-label="ค้นหาในระบบ"></div><div class="top-actions"><button class="icon-btn" id="themeBtn" aria-label="สลับธีม"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/></svg></button><button class="icon-btn" aria-label="การแจ้งเตือน"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><div class="avatar">A</div></div></header><section class="content" id="content"></section></main></div>
<script>
const paths={dashboard:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',finance:'<path d="M4 19V5M4 19h16M8 16v-3M12 16V8M16 16v-6"/>',ops:'<path d="M4 17c3-8 7-8 10-3 2 3 4 2 6-5M4 20h16"/>',data:'<path d="M4 5h16v14H4zM4 10h16M10 5v14M15 10v9"/>',news:'<path d="M4 6h16v12H4zM7 10h10M7 14h7"/>',staff:'<path d="M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11a3 3 0 0 0 0-6M17 15h1a3 3 0 0 1 3 3v2"/>',account:'<path d="M12 3a3 3 0 0 0-3 3v1a3 3 0 0 0-6 0v1a3 3 0 0 0 3 3v1a3 3 0 0 0 0 6h1a3 3 0 0 0 6 0v-1a3 3 0 0 0-3-3v-1a3 3 0 0 0 0-6h-1"/>',test:'<path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/>'};
const menu=[['dashboard','แดชบอร์ด'],['finance','รายได้ / จอง / ยกเลิก'],['ops','ปฏิบัติงาน / คิวรถ'],['data','จัดการข้อมูล'],['news','อัพเดทข่าวสาร'],['staff','พนักงาน / สิทธิ์'],['account','ตั้งค่าบัญชี'],['test','โหมดทดสอบ']];const nav=document.querySelector('#nav');menu.forEach(([id,label],i)=>{if(i===5)nav.insertAdjacentHTML('beforeend','<div class="nav-section">การดูแลระบบ</div>');nav.insertAdjacentHTML('beforeend',`<button data-page="${id}"><svg viewBox="0 0 24 24">${paths[id]}</svg><span class="nav-label">${label}</span></button>`) });
const empty='<div class="empty"><strong>ยังไม่มีข้อมูลให้แสดง</strong><span>ระบบจะแสดงข้อมูลเมื่อเชื่อมต่อแหล่งข้อมูลที่ยืนยันแล้ว</span></div>';const head=(t,d,a='')=>`<div class="crumb">SL-Transit / Admin ERP</div><div class="head"><div><h1>${t}</h1><p>${d}</p></div>${a?`<div class="actions"><button class="btn primary">${a}</button></div>`:''}</div>`;const table=(cols)=>`<div class="table-wrap"><table class="table"><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td colspan="${cols.length}">${empty}</td></tr></tbody></table></div>`;
function dashboard(){return head('แดชบอร์ด','ภาพรวมการดำเนินงานของ SL-Transit','รีเฟรชข้อมูล')+`<div class="grid kpis">${['รายได้วันนี้','การจองวันนี้','ยกเลิกวันนี้','ผู้โดยสารวันนี้'].map(x=>`<article class="card kpi"><div class="label">${x}</div><div class="value">—</div><div class="note">ยังไม่มีข้อมูลจากแหล่งข้อมูลที่ยืนยันแล้ว</div></article>`).join('')}</div><div class="grid two"><article class="card"><div class="panel-head"><h2>แนวโน้มรายได้และการจอง</h2><select class="field"><option>7 วันล่าสุด</option></select></div><div class="panel-body"><div class="chart">${empty}</div></div></article><article class="card"><div class="panel-head"><h2>สถานะรายการจอง</h2></div><div class="panel-body"><div class="donut"></div>${empty}</div></article></div><article class="card"><div class="panel-head"><h2>ปฏิบัติงานวันนี้</h2><span class="status">ยังไม่มีข้อมูล</span></div>${table(['เวลา','เส้นทาง','คิวรถ','สถานะ','รายละเอียด'])}</article>`}
function listPage(t,d,cols,a){return head(t,d,a)+`<div class="card"><div class="toolbar pad"><input class="field" placeholder="ค้นหา"><select class="field"><option>ทุกสถานะ</option></select><select class="field"><option>ตัวกรองเพิ่มเติม</option></select></div>${table(cols)}</div>`}
function tablePage(cols){return `<div class="card"><div class="toolbar pad"><input class="field" placeholder="ค้นหา"><select class="field"><option>ทุกสถานะ</option></select><select class="field"><option>ตัวกรองเพิ่มเติม</option></select></div>${table(cols)}</div>`}
function finance(){return head('รายได้ / จอง / ยกเลิก','ตรวจสอบภาพรวมธุรกรรมและผลกระทบของรายการ','ส่งออกข้อมูล')+`<div class="grid two"><article class="card"><div class="panel-head"><h2>รายได้ตามช่วงเวลา</h2></div><div class="panel-body"><div class="chart">${empty}</div></div></article><article class="card"><div class="panel-head"><h2>สถานะรายการ</h2></div><div class="panel-body"><div class="donut"></div>${empty}</div></article></div>`+tablePage(['รหัสรายการ','วันที่','เส้นทาง','ยอดเงิน','สถานะ'])}
function data(){return head('จัดการข้อมูล','จัดการข้อมูลต้นทางในรูปแบบตาราง ERP','เพิ่มข้อมูล')+`<div class="notice">โหมดออกแบบ UI — ยังไม่เชื่อมต่อแหล่งข้อมูลและยังไม่มีการเขียนข้อมูลจริง</div><div class="toolbar"><input class="field" placeholder="ค้นหาข้อมูล"><button class="btn">นำเข้า Excel</button><button class="btn">ส่งออก</button></div><div class="grid split card"><div>${table(['รหัส','ชื่อข้อมูล','ประเภท','สถานะ'])}</div><aside class="detail"><h3>รายละเอียดข้อมูล</h3>${empty}</aside></div>`}
function ops(){return head('ปฏิบัติงาน / คิวรถ','ติดตามเที่ยวบริการ คิวรถ และปัญหาที่ต้องดำเนินการ','สร้างคำสั่งงาน')+`<div class="grid kpis">${['กำลังจะออก','กำลังเดินทาง','ล่าช้า','ต้องตรวจสอบ'].map(x=>`<article class="card kpi"><div class="label">${x}</div><div class="value">—</div><div class="note">ยังไม่มีข้อมูล</div></article>`).join('')}</div>`+tablePage(['เวลา','เส้นทาง','คิว','รถ','คนขับ','สถานะ'])}
function news(){return listPage('อัพเดทข่าวสารลงหน้าเว็บ','สร้าง ตรวจสอบ และเผยแพร่ประกาศของ SL-Transit','สร้างข่าวสาร')}
function staff(){return listPage('พนักงาน / สิทธิ์การใช้งาน','จัดการผู้ใช้งาน บทบาท และขอบเขตการเข้าถึง','เชิญพนักงาน')}
function account(){return head('ตั้งค่าบัญชี','จัดการข้อมูลบัญชี ความปลอดภัย และการแจ้งเตือน')+`<div class="card pad"><div class="settings"><div class="settings-nav"><button class="active">ข้อมูลบัญชี</button><button>ความปลอดภัย</button><button>การแจ้งเตือน</button><button>Session และอุปกรณ์</button></div><div><h2 style="margin-top:0">ข้อมูลบัญชี</h2><div class="form-grid"><div class="form-group"><label>ชื่อแสดงผล</label><input class="form-control" value="ผู้ดูแลระบบ" readonly></div><div class="form-group"><label>อีเมล</label><input class="form-control" value="ยังไม่มีข้อมูล" readonly></div><div class="form-group"><label>บทบาท</label><input class="form-control" value="Owner" readonly></div><div class="form-group"><label>ภาษา</label><select class="form-control"><option>ภาษาไทย</option></select></div></div></div></div></div>`}
function test(){return head('โหมดทดสอบ','ควบคุมสภาพแวดล้อมสำหรับการทดสอบอย่างปลอดภัย')+`<div class="card pad"><div class="test-state"><div><h2 style="margin:0">โหมดทดสอบปิดอยู่</h2><span class="status">ยังไม่ได้เปิดใช้งาน</span></div><button class="switch" aria-label="สลับโหมดทดสอบ"></button></div><div class="notice">เมื่อเปิดโหมดทดสอบ ระบบต้องแสดงสถานะให้เห็นชัดเจน และป้องกัน action ที่กระทบ production</div><h2>กิจกรรมโหมดทดสอบ</h2>${empty}</div>`}
function logout(){return head('ออกจากระบบ','สิ้นสุด session ของผู้ใช้งานปัจจุบัน')+`<div class="card pad" style="max-width:520px"><h2>ต้องการออกจากระบบหรือไม่?</h2><p class="note">หลังจากออกจากระบบ คุณจะต้องเข้าสู่ระบบใหม่เพื่อเข้าถึง Admin ERP</p><div class="actions"><button class="btn">ยกเลิก</button><button class="btn primary">ออกจากระบบ</button></div></div>`}
const views={dashboard,finance,ops,data,news,staff,account,test,logout};function render(id='dashboard'){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.querySelector('#content').innerHTML=views[id]();document.querySelector('#side').classList.remove('open')}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)render(b.dataset.page)});document.querySelector('#content').addEventListener('click',e=>{const toggle=e.target.closest('.switch');if(toggle)toggle.classList.toggle('on')});document.querySelector('#themeBtn').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};document.querySelector('#menuBtn').onclick=()=>document.querySelector('#side').classList.toggle('open');render();
</script></body></html>
