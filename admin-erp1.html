    (function(){
      function collectRows(){return Array.from(document.querySelectorAll('.erp-table tbody tr')).map(function(row){var item={};row.querySelectorAll('input[aria-label],select[aria-label]').forEach(function(field){item[field.getAttribute('aria-label')]=field.value||''});return item})}

      function actionMode(button){var mode=button&&button.dataset&&button.dataset.erpAction;if(mode)return mode;var title=document.querySelector('#content .head h1');if(title&&title.textContent==='ศูนย์ข้อมูล ERP'&&button&&button.textContent.trim()==='บันทึกฉบับร่าง')return 'save';return ''}
      document.addEventListener('click',function(e){
        var button=e.target.closest('[data-erp-action],#content .head .btn');if(!button||!window.SLTransitErpDraftAdapter)return;var mode=actionMode(button);if(['save','validate','history','compare'].indexOf(mode)===-1)return;e.stopImmediatePropagation();
        setTimeout(function(){
          var entity=(document.querySelector('.erp-meta-card strong')||{}).textContent||'ข้อมูล ERP';
          if(mode==='save'){var draft=window.SLTransitErpDraftAdapter.create({entity:entity,rows:collectRows()});localDrawer('บันทึกฉบับร่าง', '<p class="label">บันทึกไว้ในโหมดทดสอบของเบราว์เซอร์เท่านั้น</p><div class="impact-list"><div><span>Draft ID</span><strong>'+draft.draftId+'</strong></div><div><span>สถานะ</span><strong>ฉบับร่าง</strong></div><div><span>แหล่งจัดเก็บ</span><strong>Session ของเครื่องนี้</strong></div></div><div class="content-actions"><button class="btn" data-local-validate="'+draft.draftId+'">ตรวจสอบข้อมูล</button><button class="btn primary" data-local-submit="'+draft.draftId+'">ส่งตรวจสอบ</button></div><div class="notice">ยังไม่เขียน Firebase และยังไม่เผยแพร่ข้อมูลจริง</div>');}
          if(mode==='validate'){var report=window.SLTransitErpDraftAdapter.validateRows(collectRows());localDrawer('ผลการตรวจสอบข้อมูล','<div class="impact-list"><div><span>จำนวนแถว</span><strong>'+report.rowCount+'</strong></div><div><span>แถวที่กรอกข้อมูล</span><strong>'+report.filledCount+'</strong></div><div><span>แถวที่ไม่มีรหัสอ้างอิง</span><strong>'+report.missingIdentityCount+'</strong></div><div><span>ความพร้อม</span><strong>'+(report.ready?'พร้อมส่งตรวจสอบ':'ต้องแก้ไขข้อมูล')+'</strong></div></div><div class="notice">การตรวจสอบนี้เป็น Local/Test-only ยังไม่ตรวจ foreign key จาก Firebase</div>');}
          if(mode==='history'){var history=window.SLTransitErpDraftAdapter.history();localDrawer('ประวัติฉบับร่าง','<div class="empty"><div><strong>'+ (history.length?'มีรายการใน Session นี้':'ยังไม่มีประวัติ') +'</strong><span>'+ (history.length?'แสดงเฉพาะการทดลองบนเครื่องนี้':'เริ่มจากการบันทึกฉบับร่าง') +'</span></div></div><div class="notice">Audit จริงจะเชื่อม `data/erpDataCenter/meta/audit` หลังผ่านการอนุมัติ backend</div>');}
          if(mode==='compare'){localDrawer('เปรียบเทียบเวอร์ชัน','<div class="empty"><div><strong>ยังไม่มีเวอร์ชันสำหรับเปรียบเทียบ</strong><span>เวอร์ชันจริงจะมาจาก ERP Data Center หลังมีการ Review</span></div></div><div class="notice">ยังไม่อ่านหรือเขียน Firebase ในโหมดนี้</div>');}
        },0);
      });
      document.addEventListener('click',function(e){var validate=e.target.closest('[data-local-validate]');if(validate&&window.SLTransitErpDraftAdapter){var result=window.SLTransitErpDraftAdapter.validate(validate.dataset.localValidate);localDrawer('ผลการตรวจสอบฉบับร่าง','<div class="impact-list"><div><span>สถานะ</span><strong>'+((result.draft&&result.draft.status)||'ต้องตรวจสอบ')+'</strong></div><div><span>แถวที่กรอกข้อมูล</span><strong>'+result.report.filledCount+'</strong></div><div><span>แถวที่ไม่มีรหัส</span><strong>'+result.report.missingIdentityCount+'</strong></div></div><div class="notice">ผลนี้จัดเก็บใน Session เท่านั้น</div>')}});
      document.addEventListener('click',function(e){var submit=e.target.closest('[data-local-submit]');if(submit&&window.SLTransitErpDraftAdapter){var draft=window.SLTransitErpDraftAdapter.submitForReview(submit.dataset.localSubmit);localDrawer('ส่งตรวจสอบแล้ว','<div class="notice">ฉบับร่าง '+(draft?draft.draftId:'')+' เปลี่ยนเป็นสถานะรอตรวจสอบในโหมดทดสอบ</div><div class="notice">ยังไม่มีการเขียน Firebase และยังไม่มีการเผยแพร่จริง</div>')}});
    })();
  </script>

  <script>
    (function(global){'use strict';var KEY='slTransitAdminErpDraftsV1';function read(){try{return JSON.parse(sessionStorage.getItem(KEY)||'{}')}catch(e){return {}}}function write(value){try{sessionStorage.setItem(KEY,JSON.stringify(value))}catch(e){}}function id(){return 'draft_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}function now(){return new Date().toISOString()}function audit(store,draftId,action,detail){store[draftId].audit=store[draftId].audit||[];store[draftId].audit.push({action:action,detail:detail||'',at:now()})}function create(input){input=input||{};var store=read(),draftId=id();store[draftId]={draftId:draftId,entity:input.entity||'',rows:input.rows||[],status:'draft',createdAt:now(),updatedAt:now(),audit:[]};audit(store,draftId,'draft_created','สร้างฉบับร่างในเครื่อง');write(store);return store[draftId]}function validateRows(rows){rows=Array.isArray(rows)?rows:[];var filled=rows.filter(function(row){return Object.keys(row||{}).some(function(key){return row[key]!==''})}),missing=filled.filter(function(row){return !row.id&&!row.code&&!row.tripId&&!row.stopKey&&!row.vehicleId}).length;return{rowCount:rows.length,filledCount:filled.length,missingIdentityCount:missing,duplicateCheck:'ยังไม่ได้เชื่อมข้อมูลอ้างอิง',ready:filled.length>0&&missing===0}}function validate(draftId,rows){var store=read(),draft=store[draftId];if(!draft)return{status:'missing',report:validateRows(rows)};var report=validateRows(rows||draft.rows);draft.validation=report;draft.status=report.ready?'validated':'error';draft.updatedAt=now();audit(store,draftId,'validated',report.ready?'ผ่านการตรวจเบื้องต้น':'พบข้อมูลที่ต้องตรวจสอบ');write(store);return{draft:draft,report:report}}function submitForReview(draftId){var store=read(),draft=store[draftId];if(!draft)return null;draft.status='review';draft.updatedAt=now();audit(store,draftId,'submitted_for_review','ส่งตรวจสอบในโหมดทดสอบ');write(store);return draft}function history(draftId){var store=read();return draftId&&store[draftId]?store[draftId].audit:Object.keys(store).map(function(key){return store[key]})}global.SLTransitErpDraftAdapter={create:create,validate:validate,validateRows:validateRows,submitForReview:submitForReview,history:history,storageKey:KEY,safety:{firebaseWrites:false,productionWrites:false,persistence:'sessionStorage only'}}}(window));
  </script>

rd-list-row"><div><strong>Checks</strong><span>ผลตรวจเงื่อนไข</span></div><div class="dashboard-status">—</div></div></div></section></div><section class="card detail" style="margin-top:16px"><h2>ผลการทดสอบล่าสุด</h2><div class="notice">ยังไม่มีผลการทดสอบ · ยังไม่เชื่อมต่อ k6 runtime</div></section>`;

  <script>
    function syncSwitches(){document.querySelectorAll('.switch').forEach(function(sw){var input=sw.querySelector('input');if(input)sw.classList.toggle('is-on',input.checked)});}
    document.addEventListener('change',function(e){
      if(!e.target.matches('.switch input')) return;
      const sw=e.target.closest('.switch');
      if(sw){sw.setAttribute('aria-checked',e.target.checked?'true':'false');sw.classList.toggle('is-on',e.target.checked)}
      const row=e.target.closest('.rule-line,.payment-channel');
      if(row){const status=row.querySelector('.dashboard-status');if(status)status.textContent=e.target.checked?'เปิด':'ปิด';}
    });
    document.addEventListener('pointerdown',function(e){var sw=e.target.closest('.switch');if(!sw)return;var input=sw.querySelector('input');if(!input)return;e.preventDefault();e.stopPropagation();input.checked=!input.checked;input.dispatchEvent(new Event('change',{bubbles:true}))},true);
    syncSwitches();
    new MutationObserver(syncSwitches).observe(document.getElementById('content'),{childList:true,subtree:true});

  <script>
    (function(){
      function readTestMode(){try{return sessionStorage.getItem('slTransitTestMode')==='on'}catch(e){return false}}
      function writeTestMode(value){try{sessionStorage.setItem('slTransitTestMode',value?'on':'off')}catch(e){}}
      var testModeActive=readTestMode(), popupOpen=false, lastPopupPage='';
      window.__slTestModeActive=testModeActive;
      function showTestPopup(pageKey){
        if(popupOpen)return; popupOpen=true;
        lastPopupPage=pageKey||document.querySelector('#content .head h1')?.textContent||'page';
        var layer=document.createElement('div');layer.className='test-mode-layer';layer.id='testModeLayer';layer.setAttribute('aria-live','assertive');
        layer.innerHTML='<section class="test-mode-dialog" role="dialog" aria-modal="true"><div class="test-kicker">SL-Transit · Test Mode</div><h2>กำลังอยู่ในโหมดทดสอบ</h2><p>คุณกำลังทดสอบระบบผ่านคอมพิวเตอร์ ข้อมูลและการทำรายการจะไม่ส่งผลจริง</p><div class="test-mode-list"><div><strong>การชำระเงินจริง</strong><span>ปิด</span></div><div><strong>บริการที่มีค่าใช้จ่าย</strong><span>ปิด</span></div><div><strong>การแจ้งเตือนภายนอก</strong><span>ปิด</span></div><div><strong>ข้อมูล Production</strong><span>ห้ามเขียน</span></div></div><div class="test-mode-scope"><div><strong>ทำได้</strong><span>เปิดหน้า กรอกฟอร์ม และจำลองการกดปุ่ม</span></div><div><strong>ไม่ทำจริง</strong><span>จ่ายเงิน ส่งแจ้งเตือน หรือบันทึก Production</span></div></div><button class="btn primary" id="testModeAcknowledge">รับทราบและเริ่มทดสอบ</button></section>';
        document.body.appendChild(layer);document.body.dataset.testPopupOverflow=document.body.style.overflow;document.body.style.overflow='hidden';var acknowledge=document.getElementById('testModeAcknowledge');acknowledge.focus();acknowledge.onclick=function(){layer.remove();document.body.style.overflow=document.body.dataset.testPopupOverflow||'';delete document.body.dataset.testPopupOverflow;popupOpen=false};
      }
      function syncTopbar(){
        var topLeft=document.querySelector('.top-left');if(!topLeft)return;
        var badge=document.getElementById('testModeTopbar');
        if(!badge){badge=document.createElement('span');badge.id='testModeTopbar';badge.className='test-mode-topbar';badge.setAttribute('role','status');badge.textContent='โหมดทดสอบ';topLeft.insertBefore(badge,topLeft.querySelector('.search')||null)}
        badge.hidden=!testModeActive;document.body.classList.toggle('test-mode-on',testModeActive);
      }
      function syncTestMode(){
        var title=document.querySelector('#content .head h1');
        if(title&&title.textContent==='โหมดทดสอบและเผยแพร่'){
          var toggle=document.querySelector('#content .banner .switch-control');
          if(toggle&&!toggle.dataset.testBound){toggle.dataset.testBound='1';toggle.addEventListener('click',function(){setTimeout(function(){testModeActive=toggle.classList.contains('is-on');window.__slTestModeActive=testModeActive;writeTestMode(testModeActive);if(testModeActive){lastPopupPage='';showTestPopup(title.textContent)}},0)})}
        }
        syncTopbar();
        if(testModeActive){if(!document.querySelector('.test-mode-banner')){var b=document.createElement('div');b.className='test-mode-banner';b.textContent='TEST MODE · ปิดการชำระเงินจริง บริการมีค่าใช้จ่าย และการเขียนข้อมูล Production';document.querySelector('main').prepend(b)}var pageKey=title?title.textContent:'page';if(lastPopupPage!==pageKey)showTestPopup(pageKey)}
        else {var b=document.querySelector('.test-mode-banner');if(b)b.remove()}
      }
      new MutationObserver(syncTestMode).observe(document.getElementById('content'),{childList:true,subtree:true});
      setTimeout(syncTestMode,0);
    })();
  </script>
  <script>

      function polishCopy(){document.querySelectorAll('#content *').forEach(function(el){if(el.children.length)return;const value=el.textContent.trim();if(copyMap[value])el.textContent=copyMap[value]})}

  <script>
    (function(){
      const centerState={key:'stops',rows:3};
      const centerLabels={stops:'ป้ายต้นทาง',routes:'เส้นทาง',fares:'เส้นทางและราคา',rounds:'รอบเวลา',stopTimes:'คิวรถและเวลา',vehicles:'รถและคิว',payments:'การชำระเงินและผู้ติดต่อ',driverGroups:'รถ ผู้ขับ และกลุ่มบริการ',staff:'ผู้ใช้งานและการแจ้งเตือน',accounts:'บัญชีและสิทธิ์',alerts:'ศูนย์แจ้งเตือน'};
      const stateOptions=['ฉบับร่าง','ตรวจสอบแล้ว','มีข้อผิดพลาด','รอตรวจสอบ'];
      function cellInput(label){return `<input aria-label="${label}" placeholder="${label}">`}
      function rows(cols){return Array.from({length:centerState.rows},(_,i)=>`<tr><td class="erp-row-state"><span class="status">${i===0?'แถวใหม่':'ว่าง'}</span></td>${cols.map(c=>`<td>${cellInput(c)}</td>`).join('')}<td><select aria-label="สถานะข้อมูล"><option>ฉบับร่าง</option><option>รอตรวจสอบ</option><option>มีข้อผิดพลาด</option><option>ตรวจสอบแล้ว</option></select></td><td><button class="action" data-erp-row="${i}">รายละเอียด</button></td></tr>`).join('')}
      function erpCenter(key){
        centerState.key=key; const meta=dataSets[key]||dataSets.stops; const sheet=meta[0], cols=meta[1];
        return head('ศูนย์ข้อมูล ERP','แหล่งข้อมูลกลางสำหรับจัดการข้อมูลที่เชื่อมโยงไปยังทุกหน้าของแพลตฟอร์ม','บันทึกฉบับร่าง')+`<div class="erp-center">
          <section class="card"><div class="erp-meta"><div class="erp-meta-card"><small>หมวดข้อมูล</small><strong>${centerLabels[key]||sheet}</strong></div><div class="erp-meta-card"><small>สถานะข้อมูล</small><strong class="erp-status">ยังไม่เชื่อมต่อแหล่งข้อมูล</strong></div><div class="erp-meta-card"><small>เวอร์ชัน</small><strong>ฉบับร่าง —</strong></div><div class="erp-meta-card"><small>อัปเดตล่าสุด</small><strong>ยังไม่มีข้อมูล</strong></div></div><div class="erp-tabs">${Object.keys(centerLabels).map(k=>`<button class="${k===key?'active':''}" data-erp-tab="${k}">${centerLabels[k]}</button>`).join('')}</div></section>
          <section class="card"><div class="erp-toolbar"><div class="erp-toolbar-left"><input class="field" data-erp-search placeholder="ค้นหาในหมวด ${centerLabels[key]||sheet}"><select class="field"><option>ทุกสถานะ</option>${stateOptions.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="erp-actions"><button class="btn" data-erp-action="validate">ตรวจสอบข้อมูล</button><button class="btn" data-erp-action="import">นำเข้า Excel</button><button class="btn" data-erp-action="template">ดาวน์โหลดแม่แบบ</button></div></div></section>
          <section class="card erp-table-card"><div class="toolbar"><div><strong>${sheet}</strong><span class="label">ตารางแก้ไขแบบ spreadsheet · ไม่มีข้อมูลตัวอย่าง</span></div><div class="erp-actions"><button class="btn" data-erp-action="add">เพิ่มแถว</button><button class="btn primary" data-erp-action="save">บันทึกฉบับร่าง</button></div></div><div class="table-wrap"><table class="table erp-table"><thead><tr><th>สถานะแถว</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>สถานะข้อมูล</th><th></th></tr></thead><tbody>${rows(cols)}</tbody></table></div><div class="table-footer erp-footer-note"><span>แสดงแถวว่างสำหรับกรอกข้อมูล · ${centerLabels[key]||sheet}</span><span>ยังไม่บันทึกไปยังระบบจริง</span></div></section>
          <div class="erp-lower"><section class="card detail"><h2>คุณภาพข้อมูล</h2><div class="erp-check-list"><div class="erp-check"><span>ข้อมูลซ้ำ</span><strong>ยังไม่ได้ตรวจสอบ</strong></div><div class="erp-check"><span>ฟิลด์ที่จำเป็น</span><strong>ยังไม่ได้ตรวจสอบ</strong></div><div class="erp-check"><span>ความสัมพันธ์ข้ามหมวด</span><strong>ยังไม่ได้ตรวจสอบ</strong></div><div class="erp-check"><span>ความพร้อมเผยแพร่</span><strong>ยังไม่พร้อม</strong></div></div></section><section class="card detail"><h2>สิทธิ์และประวัติ</h2><div class="notice">การอ่าน แก้ไข ตรวจสอบ และเผยแพร่แยกตามสิทธิ์ผู้ใช้งาน</div><div class="content-actions"><button class="btn" data-erp-action="history">ดูประวัติการแก้ไข</button><button class="btn" data-erp-action="compare">เปรียบเทียบเวอร์ชัน</button></div><div class="erp-permission-note">ทุกการเปลี่ยนแปลงต้องเป็นฉบับร่างและมี audit ก่อนเผยแพร่</div></section></div>
        </div>`;
      }

          openDrawer('<h2>บันทึกฉบับร่าง</h2><p class="label">บันทึกไว้ในโหมดทดสอบของเบราว์เซอร์เท่านั้น</p><div class="impact-list"><div><span>Draft ID</span><strong>'+draft.draftId+'</strong></div><div><span>สถานะ</span><strong>ฉบับร่าง</strong></div><div><span>แหล่งจัดเก็บ</span><strong>Session ของเครื่องนี้</strong></div></div><div class="content-actions"><button class="btn" data-local-validate="'+draft.draftId+'">ตรวจสอบข้อมูล</button><button class="btn primary" data-local-submit="'+draft.draftId+'">ส่งตรวจสอบ</button></div><div class="notice">ยังไม่เขียน Firebase และยังไม่เผยแพร่ข้อมูลจริง</div>');

          template:'<p class="label">แม่แบบนี้มีเฉพาะโครงสร้างคอลัมน์และ ID ที่จำเป็น ไม่มีรายชื่อ ราคา พิกัด หรือข้อมูลตัวอย่าง</p><div class="content-actions"><button class="btn primary">เตรียมดาวน์โหลดแม่แบบ</button></div><div class="notice">การดาวน์โหลดเป็น Preview ของ workflow เท่านั้น</div>',

  <script>
    (function(){
      var form=document.getElementById('loginForm'),error=document.getElementById('loginError'),submit=document.getElementById('loginSubmit'),config=window.SLTransitAdminErpConfig,preview=new URLSearchParams(location.search).get('adminPreview')==='1',deniedMessage='';
      function setAuthenticated(value){document.body.classList.toggle('authenticated',value);document.body.classList.toggle('auth-preview',!value);if(value){document.getElementById('loginScreen').classList.add('login-screen-hidden')}else{document.getElementById('loginScreen').classList.remove('login-screen-hidden')}}
      function messageFor(error){var code=error&&error.code||'',status=error&&error.details&&Number(error.details.status||0);if(code==='forbidden'||code==='admin_erp_read_permission_required')return 'บัญชีนี้เข้าสู่ระบบได้ แต่ยังไม่มีสิทธิ์อ่านข้อมูล Admin ERP';if(code==='endpoint_error'&&status===500)return 'ระบบกลางไม่พร้อมอ่านข้อมูล ERP ขณะนี้ กรุณาลองใหม่อีกครั้ง';if(code==='endpoint_error')return 'ติดต่อระบบกลางไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';if(code==='token_required'||code==='invalid_admin_token')return 'ไม่พบการยืนยันตัวตนที่ใช้งานได้ กรุณาเข้าสู่ระบบใหม่';if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found')return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';if(code==='auth/too-many-requests')return 'ระบบพักการเข้าสู่ระบบชั่วคราว เนื่องจากมีการลองหลายครั้ง';if(code==='auth_not_configured')return 'ยังไม่ได้ตั้งค่าระบบยืนยันตัวตนจริง';return 'ไม่สามารถตรวจสอบสิทธิ์ได้ กรุณาลองใหม่หรือติดต่อ Owner'}
      function showError(value){if(error)error.textContent=value||''}
      function showDenied(){setAuthenticated(false);showError(deniedMessage||'')}
      function verifyAccess(){
        if(!config||typeof config.getIdToken!=='function'||!config.endpoint)return Promise.reject(Object.assign(new Error('ยังไม่ได้ตั้งค่าระบบยืนยันตัวตนจริง'),{code:'auth_not_configured'}));
        if(!window.AdminErpDataSource)return Promise.reject(Object.assign(new Error('ไม่พบตัวเชื่อมต่อข้อมูล Admin ERP'),{code:'data_source_not_configured'}));
        window.AdminErpDataSource.configure(config);
        return (typeof window.AdminErpDataSource.getAccess==='function'?window.AdminErpDataSource.getAccess():window.AdminErpDataSource.getDataCenter()).then(function(snapshot){if(!snapshot.permissions||snapshot.permissions.indexOf('read')===-1)throw Object.assign(new Error('ไม่มีสิทธิ์อ่านข้อมูล Admin ERP'),{code:'forbidden'});return snapshot});
      }
      if(preview){setAuthenticated(true);showError('โหมด Preview นี้ไม่อ่านข้อมูลจริงและไม่ใช้สิทธิ์ผู้ดูแล');return}
      setAuthenticated(false);
      if(!form)return;
      if(!config||typeof config.onAuthStateChanged!=='function'||typeof config.signIn!=='function'){showError('ยังไม่ได้เชื่อมต่อระบบยืนยันตัวตนจริง');return}
      if(typeof config.setSessionPersistence==='function')config.setSessionPersistence().catch(function(){});
      function handleAccessFailure(authError){
        deniedMessage=messageFor(authError);
        if(authError&&(authError.code==='forbidden'||authError.code==='admin_erp_read_permission_required'))return config.signOut().catch(function(){}).then(showDenied);
        setAuthenticated(false);showDenied();
      }
      function retryAccess(){var auth=window.firebase&&typeof window.firebase.auth==='function'?window.firebase.auth():null;if(auth&&auth.currentUser)verifyAccess().then(function(){deniedMessage='';setAuthenticated(true);showError('');window.dispatchEvent(new Event('admin-erp:refresh'))}).catch(handleAccessFailure)}
      config.onAuthStateChanged(function(user){
        if(!user){showDenied();return}
        showError('กำลังตรวจสอบสิทธิ์ Admin ERP…');
        verifyAccess().then(function(){deniedMessage='';setAuthenticated(true);showError('');window.dispatchEvent(new Event('admin-erp:refresh'))}).catch(handleAccessFailure);
      });
      document.addEventListener('visibilitychange',function(){if(!document.hidden)retryAccess()});
      window.addEventListener('online',retryAccess);
      form.addEventListener('submit',function(event){
        event.preventDefault();
        var email=(document.getElementById('loginEmail').value||'').trim(),password=document.getElementById('loginPassword').value||'';
        if(!email||!password){showError('กรุณากรอกอีเมลและรหัสผ่านให้ครบ');return}
        if(submit)submit.disabled=true;showError('กำลังตรวจสอบบัญชี…');
        config.signIn(email,password).catch(function(authError){showError(messageFor(authError))}).finally(function(){if(submit)submit.disabled=false});
      });
    })();
  </script>

-columns:1fr}.schedule-control{display:grid}.schedule-control-group{display:grid;grid-template-columns:1fr}.schedule-control input,.schedule-control select{width:100%;min-width:0}}
