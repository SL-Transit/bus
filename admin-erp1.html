<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL-Transit Admin ERP</title><style>:root{--bg:#f4f7fb;--panel:#fff;--ink:#18324d;--muted:#71849a;--line:#dbe5ef;--nav:#082b4d;--blue:#1677c8;--teal:#09a4ad;--soft:#eef6fc}html[data-theme=dark]{--bg:#0d1b2a;--panel:#14283a;--ink:#e9f2fa;--muted:#91a9bc;--line:#2b455b;--nav:#071726;--soft:#19344a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Noto Sans Thai",Arial,sans-serif;transition:.2s}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);padding:20px 14px;color:#d9e8f5}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px;border-bottom:1px solid #fff2}.brand img{width:52px;height:40px;object-fit:contain;background:#fff;border-radius:7px}.brand strong{display:block;color:#fff}.brand small{font-size:10px;color:#9eb9ce}.nav{display:grid;gap:6px;margin-top:24px}.nav button{border:0;background:transparent;color:#c4d6e5;text-align:left;border-radius:8px;padding:11px 12px}.nav button.active{background:#15639a;color:#fff;border-left:3px solid var(--teal)}.main{min-width:0}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top-right{display:flex;align-items:center;gap:10px}.search,.field{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 12px}.search{width:330px}.icon{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 11px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:700}.content{max-width:1600px;margin:auto;padding:28px}.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}.head{display:flex;justify-content:space-between;gap:18px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:29px}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px 14px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.draft{color:#a35e00;background:#fff7e8;border:1px solid #f0cc8b;padding:6px 9px;border-radius:7px;font-size:12px}.banner{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid #8bd8dc;background:color-mix(in srgb,var(--teal) 8%,var(--panel));border-radius:10px;margin-bottom:14px}.banner strong{display:block}.banner span{font-size:12px;color:var(--muted)}.ok{color:var(--teal);font-weight:700;white-space:nowrap}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 12px}.tabs button.active{border-color:#7db6ec;background:var(--soft);color:var(--blue);font-weight:700}.workflow{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.step{padding:12px 14px;border-right:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px}.step:last-child{border:0}.step strong{display:block;color:var(--ink);font-size:13px}.step.active{box-shadow:inset 0 -3px var(--blue);background:var(--soft)}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 22px #16446d0d}.toolbar{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.toolbar div{display:flex;gap:8px;flex-wrap:wrap}.scroll{overflow:auto;max-height:560px}.sheet{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%;font-size:12px}.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 11px;white-space:nowrap;text-align:left;min-width:120px}.sheet thead th{position:sticky;top:0;background:var(--soft);color:var(--muted);z-index:2}.sheet .corner,.sheet .row{position:sticky;left:0;z-index:3;width:42px;min-width:42px;text-align:center;background:var(--soft);color:var(--muted)}.sheet td.edit{height:40px;cursor:text}.sheet td.edit:hover,.sheet td.edit:focus,.sheet td.selected{outline:0;box-shadow:inset 0 0 0 1px var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--panel))}.sheet td.lock{background:color-mix(in srgb,var(--muted) 6%,var(--panel));color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:10px;padding:11px 15px;color:var(--muted);font-size:12px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.detail{padding:18px}.detail h2{font-size:16px;margin:0 0 12px}.notice{padding:13px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);background:var(--bg)}.empty{min-height:190px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}.kpi{padding:18px;min-height:125px}.value{font-size:28px;font-weight:750;margin-top:10px}.label{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{display:none}.top{height:60px;padding:0 14px}.search{width:190px}.content{padding:16px 12px}.head{display:block}.head .actions{margin-top:14px}.banner{display:block}.ok{display:block;margin-top:8px}.toolbar{display:block}.toolbar>div+div{margin-top:10px}.workflow{grid-template-columns:repeat(4,170px);overflow:auto}.lower{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="assets/sl-transit-logo-admin.jpg" alt="SL-Transit"><div><strong>SL-TRANSIT</strong><small>ADMIN ERP CONSOLE</small></div></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><input class="search" placeholder="ค้นหาในระบบ"><div class="top-right"><button class="icon" id="theme">Light</button><div class="avatar">A</div></div></header><section class="content" id="content"></section></main></div><script>const pages=[['dashboard','แดชบอร์ด'],['finance','รายได้ / จอง / ยกเลิก'],['ops','ปฏิบัติงาน / คิวรถ'],['data','จัดการข้อมูล'],['news','อัพเดทข่าวสาร'],['staff','พนักงาน / สิทธิ์'],['account','ตั้งค่าบัญชี'],['test','โหมดทดสอบ'],['logout','ออกจากระบบ']];const nav=document.querySelector('#nav');pages.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.page=id;nav.appendChild(b)});const empty='<div class="empty"><div><strong>ยังไม่มีข้อมูลให้แสดง</strong><span>หน้าจอนี้จะพร้อมเมื่อเชื่อมต่อแหล่งข้อมูลที่ยืนยันแล้ว</span></div></div>';const head=(title,desc,action='')=>'<div class="crumb">SL-Transit / Admin ERP</div><div class="head"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(action?'<div class="actions"><button class="btn primary">'+action+'</button></div>':'')+'</div>';function standard(title,desc,action){return head(title,desc,action)+'<section class="card">'+empty+'</section>'}function dashboard(){return head('แดชบอร์ด','ภาพรวมการดำเนินงานของ SL-Transit','รีเฟรชข้อมูล')+'<div class="kpis">'+['รายได้วันนี้','การจองวันนี้','ยกเลิกวันนี้','เที่ยวบริการวันนี้'].map(x=>'<article class="card kpi"><div class="label">'+x+'</div><div class="value">—</div><span class="label">ยังไม่เชื่อมต่อข้อมูลจริง</span></article>').join('')+'</div><div class="lower"><section class="card detail"><h2>แนวโน้มรายได้และการจอง</h2>'+empty+'</section><section class="card detail"><h2>สถานะแหล่งข้อมูล</h2>'+empty+'</section></div>'}const sheets=[['ป้ายต้นทาง','01_ข้อมูลป้ายต้นทาง',['รหัสอ้างอิง','รหัสระบบ (ห้ามแก้)','ชื่อป้าย','ละติจูด','ลองจิจูด','ไอคอน','ลำดับ','ประเภทป้าย','เปิดใช้ในการจอง','หมายเหตุ']],['เส้นทาง','02_เส้นทาง',['รหัสกลุ่ม (group_id)','ชื่อกลุ่ม','ลำดับกลุ่ม','ประเภทกลุ่ม','รหัสจุดต่อรถ','เวลาเปลี่ยนรถขั้นต่ำ (นาที)','เวลารอแนะนำสูงสุด (นาที)','เวลารอเหมาะสม (นาที)','ความน่าเชื่อถือ (0-100)','เปิดใช้งาน']],['เส้นทางและราคา','03_เส้นทางและราคา',['รหัสเส้นทาง (route_id)','รหัสกลุ่ม (group_id)','ลำดับในกลุ่ม','รหัสระบบต้นทาง','ต้นทาง','รหัสระบบปลายทาง','ปลายทาง','ราคา','เปิดใช้งาน']],['รอบเวลา','04_รอบเวลา',['รหัสรอบ (trip_id)','รหัสเส้นทาง (route_id)','ชื่อกลุ่ม','ต้นทาง','ปลายทาง','เวลาออก','เปิดจอง','จำนวนคนสูงสุด','หมายเหตุ']],['คิวรถ','05_คิวรถและเวลา',['ลำดับ','รหัสเที่ยว','ลำดับป้าย','รหัสเส้นทาง','ชื่อเส้นทาง','รหัสป้าย','ชื่อป้าย','เวลา']]];let active=0,rows=8;function data(){const s=sheets[active],cols=s[2],letters=cols.map((_,i)=>String.fromCharCode(65+i));return head('จัดการข้อมูล','ตารางว่างจากแม่แบบ Excel สำหรับกรอกและแก้ไขข้อมูล')+'<div class="banner"><div><strong>แม่แบบตารางจากไฟล์ Excel</strong><span>ใช้เฉพาะชื่อชีตและหัวคอลัมน์ ไม่มีการนำเนื้อหาหรือข้อมูลตัวอย่างมาแสดง</span></div><span class="ok">เซลล์แก้ไขได้ · ยังไม่เชื่อมต่อแหล่งข้อมูล</span></div><div class="tabs">'+sheets.map((x,i)=>'<button class="'+(i===active?'active':'')+'" data-sheet="'+i+'">'+x[0]+'</button>').join('')+'</div><div class="workflow"><div class="step active"><strong>Draft</strong>ฉบับร่าง</div><div class="step"><strong>Validate</strong>ตรวจสอบข้อมูล</div><div class="step"><strong>Review</strong>รอตรวจทาน</div><div class="step"><strong>Publish</strong>เผยแพร่</div></div><section class="card"><div class="toolbar"><div><select class="field" id="sheetSelect">'+sheets.map((x,i)=>'<option value="'+i+'" '+(i===active?'selected':'')+'>'+x[1]+'</option>').join('')+'</select><input class="field" placeholder="ค้นหาในชีต"></div><div><button class="btn">นำเข้า Excel</button><button class="btn">ส่งออก</button><button class="btn primary">บันทึกฉบับร่าง</button></div></div><div class="scroll"><table class="sheet"><thead><tr><th class="corner">#</th>'+letters.map(x=>'<th>'+x+'</th>').join('')+'</tr><tr><th class="corner">1</th>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+Array.from({length:rows},(_,r)=>'<tr><td class="row">'+(r+2)+'</td>'+cols.map((_,c)=>'<td class="'+(c===1?'lock':'edit')+'" '+(c===1?'':'contenteditable="true"')+'></td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="foot"><span>แถวว่าง '+rows+' แถว · คลิกเซลล์เพื่อกรอกข้อมูล</span><span>คอลัมน์รหัสระบบถูกล็อกตามแม่แบบ</span></div></section><div class="lower"><section class="card detail"><h2>ตรวจสอบคุณภาพข้อมูล</h2><div class="notice">กด Validate หลังกรอกข้อมูลเพื่อแสดงผลการตรวจสอบ</div></section><section class="card detail"><h2>ประวัติการแก้ไข</h2><div class="notice">Audit log จะเริ่มบันทึกเมื่อเชื่อมต่อระบบจริง</div></section></div>'}const views={dashboard,finance:()=>standard('รายได้ / จอง / ยกเลิก','ตรวจสอบรายการธุรกรรมและผลกระทบของรายได้','ส่งออกข้อมูล'),ops:()=>standard('ปฏิบัติงาน / คิวรถ','ติดตามเที่ยวบริการ คิวรถ และปัญหาที่ต้องดำเนินการ','สร้างคำสั่งงาน'),data,news:()=>standard('อัพเดทข่าวสาร','สร้าง ตรวจสอบ และเผยแพร่ประกาศบนเว็บไซต์','สร้างข่าวสาร'),staff:()=>standard('พนักงาน / สิทธิ์','จัดการผู้ใช้งาน บทบาท และสิทธิ์การเข้าถึง','เชิญพนักงาน'),account:()=>standard('ตั้งค่าบัญชี','จัดการโปรไฟล์ ความปลอดภัย และการแจ้งเตือน'),test:()=>standard('โหมดทดสอบ','ควบคุมสภาพแวดล้อมสำหรับการทดสอบอย่างปลอดภัย'),logout:()=>head('ออกจากระบบ','สิ้นสุด session ของผู้ใช้งานปัจจุบัน')+'<section class="card detail"><h2>ต้องการออกจากระบบหรือไม่?</h2><div class="actions"><button class="btn">ยกเลิก</button><button class="btn primary">ออกจากระบบ</button></div></section>'};function render(id='dashboard'){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.querySelector('#content').innerHTML=views[id]();}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)render(b.dataset.page);const tab=e.target.closest('[data-sheet]');if(tab){active=Number(tab.dataset.sheet);render('data')}});document.querySelector('#content').addEventListener('change',e=>{if(e.target.id==='sheetSelect'){active=Number(e.target.value);render('data')}});document.querySelector('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('#theme').textContent=d.dataset.theme==='dark'?'Dark':'Light'};render();</script></body></html>
