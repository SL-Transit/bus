<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SL-Transit — ตั้งค่าแอดมินคนแรก</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  :root{--nav:#061d36;--nav2:#0d58b5;--ink:#101828;--muted:#667085;--line:#e4e7ec;--good:#12b76a;--bad:#d92d20}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,var(--nav),#0d3a63);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:12px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  h1{font-size:18px;margin:0 0 4px;color:var(--ink)}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;line-height:1.5}
  label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.4px}
  input{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px;outline:none}
  input:focus{border-color:var(--nav2);box-shadow:0 0 0 3px rgba(13,88,181,.12)}
  button{width:100%;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;min-height:42px}
  #step1Btn{background:var(--nav2);color:#fff}
  #step1Btn:disabled{background:#9db4cc;cursor:not-allowed}
  #step2Btn{background:var(--good);color:#fff;margin-top:6px}
  #step2Btn:disabled{background:#9db4cc;cursor:not-allowed}
  #msg{font-size:12.5px;text-align:center;min-height:18px;margin-top:8px}
  #msg.err{color:var(--bad)}
  #msg.ok{color:var(--good);font-weight:600}
  .uidbox{background:#f2f4f7;border-radius:6px;padding:10px 12px;font-size:12px;color:var(--ink);word-break:break-all;margin:14px 0;display:none}
  .step{display:none}
  .step.active{display:block}
  .note{background:#fffaeb;border:1px solid #fedf89;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#7a4b00;margin-top:14px;text-align:center}
</style>
<script src="system-test-mode.js?v=20260804a"></script>
</head>
<body>
  <div class="card">
    <h1>ตั้งค่าแอดมินคนแรก</h1>
    <p class="sub">หน้านี้ใช้ครั้งเดียว: ล็อกอินด้วยบัญชีแอดมินที่สร้างไว้ใน Firebase Authentication แล้วกดปุ่มเพื่อเพิ่มตัวเองเข้ารายชื่อแอดมินที่แก้ข้อมูล ERP ได้</p>

    <div id="step1" class="step active">
      <label>อีเมล</label>
      <input id="email" type="email" autocomplete="email" placeholder="admin@example.com">
      <label>รหัสผ่าน</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button id="step1Btn" type="button">เข้าสู่ระบบ</button>
    </div>

    <div id="step2" class="step">
      <div class="uidbox" id="uidBox"></div>
      <button id="step2Btn" type="button">เพิ่มตัวเองเป็นแอดมิน</button>
    </div>

    <div id="msg"></div>
    <div class="note">⚠️ ใช้ครั้งเดียวเพื่อสร้างแอดมินคนแรก หลังจากนี้ไม่ต้องใช้หน้านี้อีก — จัดการแอดมินเพิ่มเติมได้จากหน้า Admin Console</div>
  </div>

<script>
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyCuWN1RhTSnKjbg5vliTEXa8HtgY7j2spM',
    authDomain: 'sl-transit-9464e.firebaseapp.com',
    databaseURL: 'https://sl-transit-9464e-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'sl-transit-9464e',
    storageBucket: 'sl-transit-9464e.firebasestorage.app',
    messagingSenderId: '480076551107',
    appId: '1:480076551107:web:0548531ec69327a2bfe376'
  };
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth();
  var db = firebase.database();

  function $(id){ return document.getElementById(id); }
  function setMsg(text, cls){ var m=$('msg'); m.textContent=text||''; m.className=cls||''; }
  function showStep(n){ $('step1').classList.toggle('active', n===1); $('step2').classList.toggle('active', n===2); }

  $('step1Btn').addEventListener('click', function(){
    var email=($('email').value||'').trim(), pass=$('pass').value||'';
    if(!email || !pass){ setMsg('กรุณากรอกอีเมลและรหัสผ่านให้ครบ','err'); return; }
    setMsg('','');
    $('step1Btn').disabled = true;
    auth.signInWithEmailAndPassword(email, pass).then(function(cred){
      var uid = cred.user.uid;
      $('uidBox').style.display = 'block';
      $('uidBox').textContent = 'เข้าสู่ระบบสำเร็จ: ' + (cred.user.email||'') + '\nUID: ' + uid;
      showStep(2);
    }).catch(function(err){
      setMsg('เข้าสู่ระบบไม่สำเร็จ: ' + (err && err.message ? err.message : 'ลองใหม่อีกครั้ง'), 'err');
    }).then(function(){
      $('step1Btn').disabled = false;
    });
  });

  $('step2Btn').addEventListener('click', function(){
    var user = auth.currentUser;
    if(!user){ setMsg('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่','err'); showStep(1); return; }
    $('step2Btn').disabled = true;
    setMsg('กำลังบันทึก...', '');
    db.ref('data/erpDataCenter/adminAccounts/' + user.uid).set(true).then(function(){
      setMsg('เพิ่มเป็นแอดมินสำเร็จแล้ว ✅ กลับไปใช้งานหน้า Admin Console ได้เลย', 'ok');
      $('step2Btn').disabled = true;
    }).catch(function(err){
      setMsg('บันทึกไม่สำเร็จ: ' + (err && err.message ? err.message : 'ลองใหม่อีกครั้ง') + ' (ตรวจสอบว่ากฎ Firebase ยัง publish เป็นเวอร์ชันที่อนุญาต auth != null สำหรับ erpDataCenter อยู่)', 'err');
      $('step2Btn').disabled = false;
    });
  });
</script>
</body>
</html>
